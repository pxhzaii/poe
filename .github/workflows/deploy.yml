name: Deploy to Cloudflare Pages

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install wrangler
        run: npm install -g wrangler

      - name: Ensure Pages project exists
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          CODE=$(curl -sS -o /dev/null -w "%{http_code}" -m 30 \
            "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/pages/projects/poe-affix" \
            -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" || true)
          if [ "$CODE" = "200" ]; then
            echo "Pages 项目 poe-affix 已存在"
          else
            echo "创建 Pages 项目 poe-affix..."
            curl -sS -m 30 -X POST \
              "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/pages/projects" \
              -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
              -H "Content-Type: application/json" \
              -d '{"name":"poe-affix","production_branch":"main"}' | node -e '
              let i="";process.stdin.on("data",c=>i+=c);process.stdin.on("end",()=>{
                try{const j=JSON.parse(i);
                  if(!j.success){console.log("创建失败: "+JSON.stringify(j.errors));process.exit(1);}
                  else{console.log("创建成功: "+j.result.name);}
                }catch(e){console.log("响应异常:"+i.slice(0,300));process.exit(1);}
              })'
          fi

      - name: Set Pages secret (GIST_TOKEN)
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
        run: |
          echo "${{ secrets.GIST_TOKEN }}" | npx wrangler pages secret put GIST_TOKEN --project-name poe-affix

      - name: Deploy Pages
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          npx wrangler pages deploy . --project-name poe-affix --commit-dirty=true

      - name: Verify deployment
        run: |
          echo "=== 等待部署生效 ==="
          sleep 30
          echo "--- Pages 首页 ---"
          curl -sS -m 30 -o /dev/null -w "%{http_code}\n" "https://poe-affix.pages.dev" || true
          echo "--- /api/gist/data GET（应返回 JSON） ---"
          curl -sS -m 30 "https://poe-affix.pages.dev/api/gist/data" | head -c 200 || true
          echo ""
          echo "--- /api/gist/data POST（写空数组测试） ---"
          curl -sS -m 30 -X POST "https://poe-affix.pages.dev/api/gist/data" \
            -H "Content-Type: application/json" -d '{"affixes":[]}' | head -c 200 || true
          echo ""
