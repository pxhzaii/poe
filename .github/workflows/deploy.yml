name: Deploy to Cloudflare Pages

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install wrangler
        run: npm install -g wrangler

      - name: Ensure Pages project exists
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          CODE=$(curl -sS -o /dev/null -w "%{http_code}" -m 30 \
            "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/pages/projects/poe-affix" \
            -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" || true)
          if [ "$CODE" = "200" ]; then
            echo "Pages project poe-affix already exists"
          else
            echo "Creating Pages project poe-affix..."
            curl -sS -m 30 -X POST \
              "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/pages/projects" \
              -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
              -H "Content-Type: application/json" \
              -d '{"name":"poe-affix","production_branch":"main"}' | node -e '
              let i="";process.stdin.on("data",c=>i+=c);process.stdin.on("end",()=>{
                try{const j=JSON.parse(i);
                  if(!j.success){console.log("Create failed: "+JSON.stringify(j.errors));process.exit(1);}
                  else{console.log("Created: "+j.result.name);}
                }catch(e){console.log("Parse error:"+i.slice(0,300));process.exit(1);}
              })'
          fi

      - name: Bind KV namespace and set env vars
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
          KV_NAMESPACE_ID: ${{ secrets.KV_NAMESPACE_ID }}
          APP_PASSWORD: ${{ secrets.APP_PASSWORD }}
        run: |
          set -euo pipefail
          echo "Binding KV namespace + setting APP_PASSWORD env var..."
          node -e '
          const fs = require("fs");
          const payload = {
            deployment_configs: {
              production: {
                kv_namespaces: {
                  AFFIX_KV: { namespace_id: process.env.KV_NAMESPACE_ID }
                },
                env_vars: {
                  APP_PASSWORD: { value: process.env.APP_PASSWORD }
                }
              },
              preview: {
                kv_namespaces: {
                  AFFIX_KV: { namespace_id: process.env.KV_NAMESPACE_ID }
                },
                env_vars: {
                  APP_PASSWORD: { value: process.env.APP_PASSWORD }
                }
              }
            }
          };
          fs.writeFileSync("/tmp/bind-payload.json", JSON.stringify(payload));
          '
          curl -sS -m 30 -X PATCH \
            "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/pages/projects/poe-affix" \
            -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
            -H "Content-Type: application/json" \
            --data @/tmp/bind-payload.json | node -e '
            let i="";process.stdin.on("data",c=>i+=c);process.stdin.on("end",()=>{
              try{const j=JSON.parse(i);
                if(!j.success){console.log("Bind failed: "+JSON.stringify(j.errors));process.exit(1);}
                else{console.log("KV + env vars updated");}
              }catch(e){console.log("Parse error:"+i.slice(0,300));process.exit(1);}
            })'

      - name: Deploy Pages
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          npx wrangler pages deploy . --project-name poe-affix --commit-dirty=true

      - name: Verify deployment
        env:
          APP_PASSWORD: ${{ secrets.APP_PASSWORD }}
        run: |
          echo "=== Waiting for deployment to take effect ==="
          sleep 40
          echo "--- Homepage ---"
          curl -sS -m 30 -o /dev/null -w "%{http_code}\n" "https://poe.5as.cn" || true
          echo "--- GET /api/data without password (expect 401) ---"
          curl -sS -m 30 -o /dev/null -w "%{http_code}\n" "https://poe.5as.cn/api/data" || true
          echo "--- GET /api/data with wrong password (expect 401) ---"
          curl -sS -m 30 -o /dev/null -w "%{http_code}\n" -H "X-Sync-Password: wrong" "https://poe.5as.cn/api/data" || true
          echo "--- GET /api/data with correct password (expect 200) ---"
          curl -sS -m 30 -o /dev/null -w "%{http_code}\n" -H "X-Sync-Password: $APP_PASSWORD" "https://poe.5as.cn/api/data" || true
