<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>流放之路 · 词条库</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: system-ui, 'Segoe UI', Roboto, 'Helvetica Neue', sans-serif;
        }

        body {
            background: #f5f7fa;
            color: #2c3e50;
            padding: 2rem 1.5rem;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .container {
            max-width: 1100px;
            width: 100%;
        }

        /* 头部 */
        .header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            flex-wrap: wrap;
            gap: 1rem;
            margin-bottom: 1.8rem;
            border-bottom: 1px solid #dce3ec;
            padding-bottom: 1rem;
        }

        .header h1 {
            font-weight: 500;
            font-size: 1.6rem;
            letter-spacing: 1px;
            color: #2563eb;
        }

        .header-actions {
            display: flex;
            gap: 0.6rem;
            flex-wrap: wrap;
            align-items: center;
        }

        /* 通用按钮 */
        .btn {
            background: #ffffff;
            border: 1px solid #d0d9e6;
            color: #4a5568;
            padding: 0.5rem 1.1rem;
            border-radius: 30px;
            font-size: 0.88rem;
            cursor: pointer;
            transition: all 0.12s;
            font-weight: 400;
            letter-spacing: 0.2px;
            display: inline-flex;
            align-items: center;
            gap: 0.4rem;
        }

        .btn:hover {
            background: #f0f5ff;
            border-color: #93b4e8;
            color: #2563eb;
        }

        .btn-primary {
            background: #2563eb;
            border-color: #2563eb;
            color: #ffffff;
        }

        .btn-primary:hover {
            background: #1d4ed8;
            border-color: #1d4ed8;
            color: #ffffff;
        }

        .btn-danger {
            background: #ffffff;
            border-color: #e8a0a0;
            color: #c04848;
        }

        .btn-danger:hover {
            background: #fef0f0;
            border-color: #c04848;
            color: #c04848;
        }

        /* ========== 云同步条 ========== */
        .sync-bar {
            display: flex;
            align-items: center;
            gap: 0.6rem;
            flex-wrap: wrap;
            background: #ffffff;
            border: 1px solid #dce3ec;
            border-radius: 16px;
            padding: 0.7rem 1rem;
            margin-bottom: 1.2rem;
            box-shadow: 0 2px 8px rgba(0,0,0,0.04);
        }
        .sync-bar input[type="password"] {
            flex: 1;
            min-width: 140px;
            max-width: 260px;
            background: #f8fafc;
            border: 1px solid #d0d9e6;
            color: #2c3e50;
            padding: 0.5rem 0.9rem;
            border-radius: 30px;
            font-size: 0.88rem;
            outline: none;
            transition: border-color 0.12s;
        }
        .sync-bar input[type="password"]:focus {
            border-color: #2563eb;
            box-shadow: 0 0 8px rgba(37, 99, 235, 0.15);
        }
        .sync-bar .btn {
            flex-shrink: 0;
        }

        /* 快速添加按钮 */
        .quick-add-btn {
            flex-shrink: 0;
            padding: 0.45rem 1.2rem;
            font-size: 0.88rem;
        }

        /* ========== 一级分类 ========== */
        .cat-nav {
            display: flex;
            flex-wrap: wrap;
            gap: 0.7rem;
            margin-bottom: 0.8rem;
            align-items: center;
        }

        .cat-btn {
            background: #ffffff;
            border: 1px solid #d0d9e6;
            color: #4a5568;
            padding: 0.45rem 1.2rem;
            border-radius: 30px;
            font-size: 0.88rem;
            cursor: pointer;
            transition: all 0.1s;
            font-weight: 400;
            letter-spacing: 0.2px;
        }

        .cat-btn:hover {
            background: #f0f5ff;
            border-color: #93b4e8;
            color: #2563eb;
        }

        .cat-btn.active {
            background: #2563eb;
            border-color: #2563eb;
            color: #ffffff;
        }

        .cat-btn .cat-count {
            font-size: 0.72rem;
            opacity: 0.7;
            margin-left: 0.3rem;
        }

        .cat-btn.cat-add {
            border-style: dashed;
            color: #16a34a;
            border-color: #86d9a8;
        }

        .cat-btn.cat-add:hover {
            background: #f0fdf4;
            border-color: #16a34a;
            color: #16a34a;
        }

        .cat-rename-hint {
            font-size: 0.62rem;
            color: #a0afc0;
            margin-left: 0.3rem;
            display: none;
            white-space: nowrap;
        }
        .cat-btn:hover .cat-rename-hint,
        .subcat-btn:hover .cat-rename-hint,
        .subsubcat-btn:hover .cat-rename-hint {
            display: inline;
        }

        /* 二级分类行 */
        .subcat-row {
            display: flex;
            flex-wrap: wrap;
            gap: 0.5rem;
            margin-bottom: 0.8rem;
            padding: 0.7rem 0.9rem;
            background: #ffffff;
            border: 1px solid #dce3ec;
            border-radius: 14px;
            align-items: center;
        }

        .subcat-row:empty { display: none; }

        .subcat-btn {
            background: #eef2f8;
            border: 1px solid transparent;
            color: #4a5568;
            padding: 0.35rem 1rem;
            border-radius: 20px;
            font-size: 0.84rem;
            cursor: pointer;
            transition: all 0.1s;
        }

        .subcat-btn:hover {
            background: #f0f5ff;
            border-color: #93b4e8;
            color: #2563eb;
        }

        .subcat-btn.active {
            background: #2563eb;
            color: #ffffff;
        }

        .subcat-btn.active .cat-rename-hint {
            color: rgba(255,255,255,0.7);
        }

        .subcat-btn.subcat-add {
            background: transparent;
            border-style: dashed;
            color: #16a34a;
            border-color: #86d9a8;
        }

        .subcat-btn.subcat-add:hover {
            background: #f0fdf4;
            border-color: #16a34a;
        }

        .subcat-label {
            font-size: 0.75rem;
            color: #8a96a8;
            margin-right: 0.2rem;
        }

        /* 三级分类行 */
        .subsubcat-row {
            display: flex;
            flex-wrap: wrap;
            gap: 0.5rem;
            margin-bottom: 1.5rem;
            padding: 0.6rem 0.9rem;
            background: #fdfdfe;
            border: 1px solid #e8edf4;
            border-radius: 14px;
            align-items: center;
        }

        .subsubcat-row:empty { display: none; }

        .subsubcat-btn {
            background: #f4f7fc;
            border: 1px solid transparent;
            color: #5b6a80;
            padding: 0.3rem 0.95rem;
            border-radius: 18px;
            font-size: 0.8rem;
            cursor: pointer;
            transition: all 0.1s;
        }

        .subsubcat-btn:hover {
            background: #f0f5ff;
            border-color: #93b4e8;
            color: #2563eb;
        }

        .subsubcat-btn.active {
            background: #2563eb;
            color: #ffffff;
        }

        .subsubcat-btn.active .cat-rename-hint {
            color: rgba(255,255,255,0.7);
        }

        .subsubcat-btn.subsubcat-add {
            background: transparent;
            border-style: dashed;
            color: #16a34a;
            border-color: #86d9a8;
        }

        .subsubcat-btn.subsubcat-add:hover {
            background: #f0fdf4;
            border-color: #16a34a;
        }

        .subsubcat-label {
            font-size: 0.72rem;
            color: #8a96a8;
            margin-right: 0.2rem;
        }

        /* 快速添加栏 */
        .quick-add {
            display: none;
            align-items: center;
            gap: 0.8rem;
            margin-bottom: 1rem;
            padding: 0.7rem 1rem;
            background: #ffffff;
            border: 1px solid #dce3ec;
            border-radius: 14px;
            box-shadow: 0 2px 6px rgba(0,0,0,0.04);
        }
        .quick-add.show { display: flex; }
        .quick-add input {
            flex: 1;
            background: #f8fafc;
            border: 1px solid #d0d9e6;
            color: #2c3e50;
            padding: 0.55rem 1rem;
            border-radius: 30px;
            font-size: 0.92rem;
            outline: none;
            transition: border-color 0.12s;
        }
        .quick-add input:focus {
            border-color: #2563eb;
            box-shadow: 0 0 8px rgba(37, 99, 235, 0.15);
        }
        .quick-add-hint {
            font-size: 0.8rem;
            color: #8a96a8;
            white-space: nowrap;
            flex-shrink: 0;
        }
        .quick-add-hint .target {
            color: #2563eb;
            font-weight: 500;
        }

        /* 行内编辑 */
        .inline-edit-input {
            flex: 1;
            background: #ffffff;
            border: 1px solid #2563eb;
            color: #2c3e50;
            padding: 0.35rem 0.6rem;
            border-radius: 8px;
            font-size: 0.95rem;
            font-weight: 500;
            outline: none;
            box-shadow: 0 0 8px rgba(37, 99, 235, 0.15);
        }

        /* 统计 */
        .stats-bar {
            font-size: 0.85rem;
            color: #8a96a8;
            margin-bottom: 1rem;
            display: flex;
            justify-content: space-between;
            flex-wrap: wrap;
            gap: 0.5rem;
        }

        /* 词缀网格 */
        .affix-grid {
            display: grid;
            grid-template-columns: 1fr;
            gap: 1rem;
        }

        /* 卡片 */
        .affix-card {
            background: #ffffff;
            border: 1px solid #dce3ec;
            border-radius: 14px;
            padding: 1rem 1rem 1rem;
            transition: border 0.15s, background 0.15s;
            display: flex;
            flex-direction: column;
            box-shadow: 0 2px 6px rgba(0, 0, 0, 0.06);
            position: relative;
        }

        .affix-card:hover {
            border-color: #93b4e8;
            background: #fcfdff;
        }

        .affix-card-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 0.7rem;
        }

        .affix-category {
            font-size: 0.68rem;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: #8a96a8;
            font-weight: 600;
            background: #eef2f8;
            padding: 0.2rem 0.7rem;
            border-radius: 20px;
            max-width: 60%;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        /* 词缀行容器 */
        .affix-content {
            display: flex;
            flex-direction: column;
            gap: 0.4rem;
            margin-top: 0.2rem;
        }

        /* 单条词缀行 */
        .affix-row {
            display: flex;
            align-items: center;
            gap: 0.6rem;
            background: #f8fafc;
            border: 1px solid #e4e9f0;
            border-radius: 10px;
            padding: 0.5rem 0.8rem;
            cursor: pointer;
            transition: all 0.12s;
            user-select: none;
        }

        .affix-row:hover {
            background: #f0f5ff;
            border-color: #93b4e8;
            box-shadow: 0 0 8px rgba(37, 99, 235, 0.1);
        }

        .affix-row:active {
            transform: scale(0.995);
        }

        .affix-row .affix-name {
            flex: 1;
            font-size: 0.95rem;
            font-weight: 500;
            color: #2c3e50;
            word-break: break-word;
            line-height: 1.4;
        }

        .affix-row .affix-copy-icon {
            font-size: 0.8rem;
            opacity: 0.3;
            flex-shrink: 0;
            transition: opacity 0.12s;
        }

        .affix-row:hover .affix-copy-icon {
            opacity: 1;
        }

        /* 空状态 */
        .empty-state {
            grid-column: 1 / -1;
            text-align: center;
            padding: 3rem 1rem;
            color: #a0afc0;
            border: 1px dashed #d0d9e6;
            border-radius: 20px;
            background: #ffffff;
            font-size: 1rem;
            line-height: 1.8;
        }

        /* 复制反馈 */
        .toast {
            position: fixed;
            top: 30px;
            left: 50%;
            transform: translateX(-50%) scale(0.95);
            background: #2563eb;
            color: #ffffff;
            padding: 0.7rem 1.8rem;
            border-radius: 40px;
            font-size: 0.95rem;
            letter-spacing: 0.3px;
            box-shadow: 0 10px 25px -5px rgba(37, 99, 235, 0.4);
            border: 1px solid #1d4ed8;
            opacity: 0;
            transition: opacity 0.15s, transform 0.15s;
            pointer-events: none;
            z-index: 999;
            backdrop-filter: blur(6px);
            max-width: 90vw;
            word-break: break-all;
            text-align: center;
        }

        .toast.show {
            opacity: 1;
            transform: translateX(-50%) scale(1);
        }

        /* 底部 */
        .footer-note {
            margin-top: 2.5rem;
            color: #a0afc0;
            font-size: 0.78rem;
            text-align: center;
            border-top: 1px solid #dce3ec;
            padding-top: 1.5rem;
            line-height: 1.8;
        }

        /* 卡片操作按钮 */
        .card-actions {
            display: flex;
            gap: 0.3rem;
            opacity: 0.4;
            transition: opacity 0.15s;
        }

        .affix-card:hover .card-actions {
            opacity: 1;
        }

        .icon-btn {
            background: transparent;
            border: none;
            color: #a0afc0;
            cursor: pointer;
            font-size: 0.95rem;
            padding: 0.25rem 0.4rem;
            border-radius: 6px;
            transition: all 0.1s;
            line-height: 1;
        }

        .icon-btn:hover {
            background: #eef2f8;
            color: #2563eb;
        }

        .icon-btn.delete:hover {
            background: #fef0f0;
            color: #c04848;
        }

        @media (max-width: 600px) {
            body { padding: 1.2rem 0.8rem; }
            .header h1 { font-size: 1.25rem; }
            .affix-grid { grid-template-columns: 1fr; }
        }
    </style>
</head>
<body>
    <div class="container">
        <!-- 头部 -->
        <div class="header">
            <h1>⚔️ 流放之路 · 词条库</h1>
            <div class="header-actions">
                <button class="btn" id="exportBtn">📤 导出</button>
                <button class="btn" id="importBtn">📥 导入</button>
                <button class="btn btn-danger" id="clearAllBtn">🗑️ 清空</button>
            </div>
        </div>

        <!-- 密码输入 + 云同步按钮 -->
        <div class="sync-bar" id="syncBar">
            <input type="password" id="syncPassword" placeholder="云端同步密码" autocomplete="current-password">
            <button class="btn btn-primary" id="pushBtn">☁️ 备份</button>
            <button class="btn" id="pullBtn">⬇️ 恢复</button>
        </div>

        <!-- 主内容区 -->
        <div id="mainContent">
        <!-- 一级分类导航 -->
        <div class="cat-nav" id="catNav"></div>

        <!-- 二级分类行 -->
        <div class="subcat-row" id="subcatRow"></div>

        <!-- 三级分类行 -->
        <div class="subsubcat-row" id="subsubcatRow"></div>

        <!-- 快速添加栏 -->
        <div class="quick-add" id="quickAddBar">
            <input type="text" id="quickAddInput" placeholder="输入词条名称，回车或点按钮添加…" autocomplete="off">
            <button class="btn btn-primary quick-add-btn" id="quickAddBtn">添加</button>
            <span class="quick-add-hint" id="quickAddHint"></span>
        </div>

        <!-- 统计 -->
        <div class="stats-bar">
            <span id="affixCount">共 0 条词条</span>
            <span style="font-size:0.78rem; color:#8a96a8;">点击词条行复制名称</span>
        </div>

        <!-- 词条网格 -->
        <div class="affix-grid" id="affixGrid"></div>

        <!-- 底部 -->
        <div class="footer-note">
                <span id="footerText">名称点击复制 · 选分类后在添加栏输入词条回车/点按钮即可 · ✏️行内编辑 · 双击分类名可重命名</span>
        </div>
        </div>
    </div>

    <!-- 复制反馈 -->
    <div class="toast" id="toast">📋 已复制: <span id="toastValue"></span></div>

    <script>
        (function() {
            // ========== 默认配置（首次打开时自动填充，三级分类） ==========
            const DEFAULT_AFFIXES = [
                { id: 'def_1', category: '召唤装备', subcategory: '衣服', subsubcategory: '负电甲', name: '召唤生物有能量护盾时，它们的击中无视怪物的元素抗性' },
                { id: 'def_2', category: '召唤装备', subcategory: '衣服', subsubcategory: '负电甲', name: '周围敌人的闪电抗性等同于你' },
                { id: 'def_3', category: '召唤装备', subcategory: '衣服', subsubcategory: '负电甲', name: '基底此物品上装备的光环技能石等级 +#' }
            ];
            const DEFAULT_CATEGORIES = [
                { cat: '召唤装备', subs: [{ sub: '衣服', subs: ['负电甲'] }] }
            ];
            const DEFAULT_FLAG_KEY = 'poe_defaults_loaded';

            // ========== 配置 ==========
            const STORAGE_KEY = 'poe_my_affixes_v2';
            const CAT_STORAGE_KEY = 'poe_my_categories_v1';
            // 同域 API：线上版走 poe.5as.cn/api（国内可访问）；
            // 本地双击打开时用线上 API 地址，保证云同步可用
            const API_BASE = (location.protocol === 'http:' || location.protocol === 'https:')
                ? ''  // 同域
                : 'https://poe.5as.cn';  // file:// 模式走线上 API

            // ========== 状态 ==========
            let affixes = [];              // [{id, category, subcategory, subsubcategory, name}]
            let categories = [];           // [{cat, subs: [{sub, subs: []}]}]  独立存储的三级分类结构
            let currentCat = '__all__';    // 当前一级分类
            let currentSub = '__all__';    // 当前二级分类
            let currentSubSub = '__all__'; // 当前三级分类（细分类）
            let syncing = false;
            let cloudPassword = null;      // 云端同步密码
            const PWD_KEY = 'poe_sync_password';
            const syncPasswordInput = document.getElementById('syncPassword');
            const pushBtn = document.getElementById('pushBtn');
            const pullBtn = document.getElementById('pullBtn');

            // ========== DOM ==========
            const grid = document.getElementById('affixGrid');
            const toast = document.getElementById('toast');
            const toastValueSpan = document.getElementById('toastValue');
            const affixCountSpan = document.getElementById('affixCount');
            const catNav = document.getElementById('catNav');
            const subcatRow = document.getElementById('subcatRow');
            const subsubcatRow = document.getElementById('subsubcatRow');
            const quickAddBar = document.getElementById('quickAddBar');
            const quickAddInput = document.getElementById('quickAddInput');
            const quickAddHint = document.getElementById('quickAddHint');
            const exportBtn = document.getElementById('exportBtn');
            const importBtn = document.getElementById('importBtn');
            const clearAllBtn = document.getElementById('clearAllBtn');
            const quickAddBtn = document.getElementById('quickAddBtn');

            // ========== 工具 ==========
            function generateId() {
                return Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
            }

            function escapeHtml(text) {
                const div = document.createElement('div');
                div.textContent = text;
                return div.innerHTML;
            }

            async function copyToClipboard(text) {
                if (navigator.clipboard && navigator.clipboard.writeText) {
                    try {
                        await navigator.clipboard.writeText(text);
                        return true;
                    } catch (err) {}
                }
                try {
                    const textarea = document.createElement('textarea');
                    textarea.value = text;
                    textarea.style.position = 'fixed';
                    textarea.style.opacity = '0';
                    textarea.style.left = '-9999px';
                    document.body.appendChild(textarea);
                    textarea.focus();
                    textarea.select();
                    const success = document.execCommand('copy');
                    document.body.removeChild(textarea);
                    return success;
                } catch (err) {
                    return false;
                }
            }

            let toastTimer = null;
            function showToast(message, prefix = '📋 已复制') {
                toastValueSpan.textContent = message;
                toast.childNodes[0].textContent = prefix + ': ';
                toast.classList.add('show');
                if (toastTimer) clearTimeout(toastTimer);
                toastTimer = setTimeout(() => {
                    toast.classList.remove('show');
                }, 1600);
            }

            // ========== 本地存储 ==========
            function loadFromStorage() {
                const hasData = localStorage.getItem(STORAGE_KEY) !== null;
                try {
                    const raw = localStorage.getItem(STORAGE_KEY);
                    if (raw) {
                        const parsed = JSON.parse(raw);
                        if (Array.isArray(parsed)) {
                            affixes = parsed;
                        }
                    }
                } catch (e) {}
                try {
                    const catRaw = localStorage.getItem(CAT_STORAGE_KEY);
                    if (catRaw) {
                        const parsed = JSON.parse(catRaw);
                        if (Array.isArray(parsed)) {
                            categories = parsed;
                        }
                    }
                } catch (e) {}
                if (!affixes) affixes = [];
                if (!categories) categories = [];

                // 首次打开且无任何本地数据时，加载默认配置
                if (!hasData && !localStorage.getItem(DEFAULT_FLAG_KEY)) {
                    affixes = DEFAULT_AFFIXES.map(a => ({ ...a }));
                    categories = DEFAULT_CATEGORIES.map(c => ({
                        cat: c.cat,
                        subs: c.subs.map(s => ({ sub: s.sub, subs: [...s.subs] }))
                    }));
                    localStorage.setItem(DEFAULT_FLAG_KEY, '1');
                    saveToStorage();
                    return;
                }

                saveToStorage();
            }

            function saveToStorage() {
                try {
                    localStorage.setItem(STORAGE_KEY, JSON.stringify(affixes));
                    localStorage.setItem(CAT_STORAGE_KEY, JSON.stringify(categories));
                } catch (e) {
                    alert('保存失败，可能是浏览器存储空间不足或被禁用。');
                }
            }

            // ========== 分类结构管理（三级） ==========
            // 确保 cat > sub > subsub 的路径存在于 categories 中
            function ensureCategory(catName, subName, subsubName) {
                catName = (catName || '').trim();
                if (!catName) return;
                let entry = categories.find(c => c.cat === catName);
                if (!entry) {
                    entry = { cat: catName, subs: [] };
                    categories.push(entry);
                }
                if (!Array.isArray(entry.subs)) entry.subs = [];
                if (subName && subName.trim()) {
                    const sub = subName.trim();
                    let subEntry = entry.subs.find(s => s && s.sub === sub);
                    if (!subEntry) {
                        subEntry = { sub: sub, subs: [] };
                        entry.subs.push(subEntry);
                    }
                    if (!Array.isArray(subEntry.subs)) subEntry.subs = [];
                    if (subsubName && subsubName.trim()) {
                        const subsub = subsubName.trim();
                        if (!subEntry.subs.includes(subsub)) {
                            subEntry.subs.push(subsub);
                        }
                    }
                }
                saveToStorage();
            }

            function renameCategoryEntry(oldName, newName) {
                const entry = categories.find(c => c.cat === oldName);
                if (entry) {
                    entry.cat = newName;
                } else {
                    categories.push({ cat: newName, subs: [] });
                }
                saveToStorage();
            }

            function renameSubEntry(catName, oldSub, newSub) {
                const entry = categories.find(c => c.cat === catName);
                if (!entry || !Array.isArray(entry.subs)) return;
                const oldEntry = entry.subs.find(s => s && s.sub === oldSub);
                const existing = entry.subs.find(s => s && s.sub === newSub);
                if (oldEntry && existing && existing !== oldEntry) {
                    // 同名合并：旧二级分类的三级列表并入新二级分类
                    if (!Array.isArray(existing.subs)) existing.subs = [];
                    (oldEntry.subs || []).forEach(ss => {
                        if (!existing.subs.includes(ss)) existing.subs.push(ss);
                    });
                    entry.subs = entry.subs.filter(s => s !== oldEntry);
                } else if (oldEntry) {
                    oldEntry.sub = newSub;
                }
                saveToStorage();
            }

            function renameSubSubEntry(catName, subName, oldSubSub, newSubSub) {
                const entry = categories.find(c => c.cat === catName);
                if (!entry || !Array.isArray(entry.subs)) return;
                const subEntry = entry.subs.find(s => s && s.sub === subName);
                if (!subEntry) return;
                if (!Array.isArray(subEntry.subs)) subEntry.subs = [];
                if (newSubSub !== oldSubSub && subEntry.subs.includes(newSubSub)) {
                    // 同名合并：移除旧三级分类
                    subEntry.subs = subEntry.subs.filter(s => s !== oldSubSub);
                } else {
                    subEntry.subs = subEntry.subs.map(s => s === oldSubSub ? newSubSub : s);
                }
                saveToStorage();
            }

            // ========== 云同步 API ==========
            function getAuthHeaders(pwd) {
                if (!pwd) return {};
                return { 'X-Sync-Password': pwd };
            }

            async function apiRequest(method, path, body, pwd) {
                const opts = { method, headers: { ...getAuthHeaders(pwd || cloudPassword) } };
                if (body !== undefined) {
                    opts.headers['Content-Type'] = 'application/json';
                    opts.body = JSON.stringify(body);
                }
                const resp = await fetch(API_BASE + path, opts);
                const text = await resp.text();
                let data = null;
                try { data = text ? JSON.parse(text) : null; } catch (e) {}
                if (!resp.ok) {
                    const msg = (data && data.error) ? data.error : ('HTTP ' + resp.status);
                    const err = new Error(msg);
                    err.status = resp.status;
                    throw err;
                }
                return data;
            }

            function getCloudPassword() {
                const pwd = syncPasswordInput.value;
                if (pwd) cloudPassword = pwd;
                return cloudPassword;
            }

            function saveCloudPassword() {
                const pwd = syncPasswordInput.value;
                if (pwd) {
                    cloudPassword = pwd;
                    localStorage.setItem(PWD_KEY, pwd);
                } else {
                    cloudPassword = null;
                    localStorage.removeItem(PWD_KEY);
                }
            }

            async function pushCloud() {
                if (syncing) return;
                const pwd = getCloudPassword();
                if (!pwd) { alert('请先输入密码'); return; }
                if (!confirm(`将当前 ${affixes.length} 条词条备份到云端，会覆盖云端旧数据。继续？`)) return;
                syncing = true;
                pushBtn.disabled = true;
                pushBtn.textContent = '⏳ 备份中…';
                try {
                    await apiRequest('POST', '/api/data', { affixes, categories }, pwd);
                    saveCloudPassword();
                    showToast('已备份 ' + affixes.length + ' 条到云端', '☁️');
                } catch (err) {
                    alert('备份失败：' + err.message);
                } finally {
                    syncing = false;
                    pushBtn.disabled = false;
                    pushBtn.textContent = '☁️ 备份';
                }
            }

            async function pullCloud() {
                if (syncing) return;
                const pwd = getCloudPassword();
                if (!pwd) { alert('请先输入密码'); return; }
                syncing = true;
                pullBtn.disabled = true;
                pullBtn.textContent = '⏳ 恢复中…';
                try {
                    const res = await apiRequest('GET', '/api/data', undefined, pwd);
                    const remote = (res && Array.isArray(res.affixes)) ? res.affixes : [];
                    const remoteCats = (res && Array.isArray(res.categories)) ? res.categories : [];
                    const when = res && res.updated_at ? res.updated_at.slice(0, 19).replace('T', ' ') : '';
                    if (remote.length === 0 && remoteCats.length === 0) {
                        alert('云端没有数据');
                    } else {
                        if (!confirm(`云端有 ${remote.length} 条词条（本地 ${affixes.length} 条），恢复将用云端数据覆盖本地。继续？`)) {
                            return;
                        }
                        saveCloudPassword();
                        affixes = remote;
                        categories = remoteCats;
                        saveToStorage();
                        render();
                        showToast('已恢复 ' + remote.length + ' 条词条' + (when ? '（' + when + '）' : ''), '⬇️');
                    }
                } catch (err) {
                    alert('恢复失败：' + err.message);
                } finally {
                    syncing = false;
                    pullBtn.disabled = false;
                    pullBtn.textContent = '⬇️ 恢复';
                }
            }

            // ========== 分类查询（三级） ==========
            // 返回 Map<cat, Map<sub, Set<subsub>>>
            function getAllCategories() {
                const map = new Map();
                const addSub = (cat, sub) => {
                    if (!map.has(cat)) map.set(cat, new Map());
                    if (sub && !map.get(cat).has(sub)) map.get(cat).set(sub, new Set());
                    return map.get(cat);
                };
                // 独立存储的分类结构
                categories.forEach(c => {
                    if (!c || !c.cat) return;
                    addSub(c.cat, null);
                    (c.subs || []).forEach(s => {
                        // 兼容旧两级数据：subs 元素可能是字符串
                        if (typeof s === 'string') {
                            addSub(c.cat, s);
                        } else if (s && s.sub) {
                            addSub(c.cat, s.sub);
                            (s.subs || []).forEach(ss => {
                                if (ss) map.get(c.cat).get(s.sub).add(ss);
                            });
                        }
                    });
                });
                // 从词条数据中补充（覆盖云端/导入的旧数据）
                affixes.forEach(item => {
                    const cat = (item.category && item.category.trim()) || '未分类';
                    const sub = (item.subcategory && item.subcategory.trim()) || '';
                    const subsub = (item.subsubcategory && item.subsubcategory.trim()) || '';
                    addSub(cat, sub);
                    if (sub && subsub) map.get(cat).get(sub).add(subsub);
                });
                return map;
            }

            function getCategoryList() {
                return Array.from(getAllCategories().keys()).sort();
            }

            function getSubcategoryList(cat) {
                const map = getAllCategories();
                const subs = map.get(cat);
                return subs ? Array.from(subs.keys()).sort() : [];
            }

            function getSubsubcategoryList(cat, sub) {
                if (!cat || cat === '__all__' || !sub || sub === '__all__') return [];
                const map = getAllCategories();
                const subs = map.get(cat);
                if (!subs) return [];
                const subsubs = subs.get(sub);
                return subsubs ? Array.from(subsubs).sort() : [];
            }

            // ========== 渲染 ==========
            function renderCatNav() {
                catNav.innerHTML = '';
                const map = getAllCategories();
                // 合并：从数据中提取的分类 + 用户手动创建但还没词条的分类
                const allCats = new Set([...map.keys()]);
                if (currentCat !== '__all__') allCats.add(currentCat);

                const allBtn = document.createElement('button');
                allBtn.className = 'cat-btn' + (currentCat === '__all__' ? ' active' : '');
                allBtn.textContent = '全部';
                allBtn.dataset.cat = '__all__';
                catNav.appendChild(allBtn);

                Array.from(allCats).sort().forEach(cat => {
                    const count = affixes.filter(a => ((a.category || '未分类') === cat)).length;
                    const btn = document.createElement('button');
                    btn.className = 'cat-btn' + (currentCat === cat ? ' active' : '');
                    btn.dataset.cat = cat;
                    btn.innerHTML = escapeHtml(cat) + '<span class="cat-count">' + count + '</span><span class="cat-rename-hint">双击改名</span>';
                    btn.addEventListener('dblclick', (ev) => {
                        ev.stopPropagation();
                        ev.preventDefault();
                        renameCategory(cat);
                    });
                    catNav.appendChild(btn);
                });

                const addBtn = document.createElement('button');
                addBtn.className = 'cat-btn cat-add';
                addBtn.textContent = '+ 添加分类';
                addBtn.addEventListener('click', () => {
                    const newCat = prompt('输入新的一级分类名称（如：召唤装备、武器、珠宝）：');
                    if (newCat && newCat.trim()) {
                        const name = newCat.trim();
                        ensureCategory(name, null, null);
                        currentCat = name;
                        currentSub = '__all__';
                        currentSubSub = '__all__';
                        render();
                    }
                });
                catNav.appendChild(addBtn);
            }

            function renderSubcatRow() {
                subcatRow.innerHTML = '';
                if (currentCat === '__all__') return;

                const subs = getSubcategoryList(currentCat);
                // 合并：从数据中提取的 + 用户手动创建但还没词条的
                const allSubs = new Set(subs);
                if (currentSub !== '__all__') allSubs.add(currentSub);

                if (allSubs.size === 0) {
                    // 没有二级分类，也显示一个"+ 分类"按钮
                    const addBtn = document.createElement('button');
                    addBtn.className = 'subcat-btn subcat-add';
                    addBtn.textContent = '+ 分类';
                    addBtn.addEventListener('click', () => {
                        const newSub = prompt(`在「${currentCat}」下新建二级分类名称（如：衣服、头盔、戒指）：`);
                        if (newSub && newSub.trim()) {
                            const name = newSub.trim();
                            ensureCategory(currentCat, name, null);
                            currentSub = name;
                            currentSubSub = '__all__';
                            render();
                        }
                    });
                    subcatRow.appendChild(addBtn);
                    return;
                }

                const label = document.createElement('span');
                label.className = 'subcat-label';
                label.textContent = '分类：';
                subcatRow.appendChild(label);

                const allBtn = document.createElement('button');
                allBtn.className = 'subcat-btn' + (currentSub === '__all__' ? ' active' : '');
                allBtn.textContent = '全部';
                allBtn.dataset.sub = '__all__';
                subcatRow.appendChild(allBtn);

                Array.from(allSubs).sort().forEach(sub => {
                    const count = affixes.filter(a => (a.category === currentCat && a.subcategory === sub)).length;
                    const btn = document.createElement('button');
                    btn.className = 'subcat-btn' + (currentSub === sub ? ' active' : '');
                    btn.dataset.sub = sub;
                    btn.textContent = sub + ' (' + count + ')';
                    btn.addEventListener('dblclick', (ev) => {
                        ev.stopPropagation();
                        ev.preventDefault();
                        renameSubcategory(currentCat, sub);
                    });
                    subcatRow.appendChild(btn);
                });

                const addBtn = document.createElement('button');
                addBtn.className = 'subcat-btn subcat-add';
                addBtn.textContent = '+ 分类';
                addBtn.addEventListener('click', () => {
                    const newSub = prompt(`在「${currentCat}」下新建二级分类名称（如：衣服、头盔、戒指）：`);
                    if (newSub && newSub.trim()) {
                        const name = newSub.trim();
                        ensureCategory(currentCat, name, null);
                        currentSub = name;
                        currentSubSub = '__all__';
                        render();
                    }
                });
                subcatRow.appendChild(addBtn);
            }

            function renderSubsubcatRow() {
                subsubcatRow.innerHTML = '';
                if (currentCat === '__all__' || currentSub === '__all__') return;

                const subsubs = getSubsubcategoryList(currentCat, currentSub);
                // 合并：当前选中的（可能来自历史数据）
                const allSubSubs = new Set(subsubs);
                if (currentSubSub !== '__all__') allSubSubs.add(currentSubSub);

                if (allSubSubs.size === 0) {
                    const addBtn = document.createElement('button');
                    addBtn.className = 'subsubcat-btn subsubcat-add';
                    addBtn.textContent = '+ 细分类';
                    addBtn.addEventListener('click', () => {
                        const name = prompt(`在「${currentCat} · ${currentSub}」下新建三级分类名称（如：负电甲）：`);
                        if (name && name.trim()) {
                            const trimmed = name.trim();
                            ensureCategory(currentCat, currentSub, trimmed);
                            currentSubSub = trimmed;
                            render();
                        }
                    });
                    subsubcatRow.appendChild(addBtn);
                    return;
                }

                const label = document.createElement('span');
                label.className = 'subsubcat-label';
                label.textContent = '细分类：';
                subsubcatRow.appendChild(label);

                const allBtn = document.createElement('button');
                allBtn.className = 'subsubcat-btn' + (currentSubSub === '__all__' ? ' active' : '');
                allBtn.textContent = '全部';
                allBtn.dataset.subsub = '__all__';
                subsubcatRow.appendChild(allBtn);

                Array.from(allSubSubs).sort().forEach(subsub => {
                    const count = affixes.filter(a =>
                        a.category === currentCat && a.subcategory === currentSub && a.subsubcategory === subsub
                    ).length;
                    const btn = document.createElement('button');
                    btn.className = 'subsubcat-btn' + (currentSubSub === subsub ? ' active' : '');
                    btn.dataset.subsub = subsub;
                    btn.textContent = subsub + ' (' + count + ')';
                    btn.addEventListener('dblclick', (ev) => {
                        ev.stopPropagation();
                        ev.preventDefault();
                        renameSubSubcategory(currentCat, currentSub, subsub);
                    });
                    subsubcatRow.appendChild(btn);
                });

                const addBtn = document.createElement('button');
                addBtn.className = 'subsubcat-btn subsubcat-add';
                addBtn.textContent = '+ 细分类';
                addBtn.addEventListener('click', () => {
                    const name = prompt(`在「${currentCat} · ${currentSub}」下新建三级分类名称（如：负电甲）：`);
                    if (name && name.trim()) {
                        const trimmed = name.trim();
                        ensureCategory(currentCat, currentSub, trimmed);
                        currentSubSub = trimmed;
                        render();
                    }
                });
                subsubcatRow.appendChild(addBtn);
            }

            function renderQuickAddBar() {
                if (currentCat === '__all__') {
                    quickAddBar.classList.remove('show');
                    return;
                }
                quickAddBar.classList.add('show');
                let target = currentCat;
                if (currentSub !== '__all__') {
                    target = currentCat + ' · ' + currentSub;
                }
                if (currentSub !== '__all__' && currentSubSub !== '__all__') {
                    target = currentCat + ' · ' + currentSub + ' · ' + currentSubSub;
                }
                quickAddHint.innerHTML = '添加到 <span class="target">' + escapeHtml(target) + '</span>';
            }

            function render() {
                renderCatNav();
                renderSubcatRow();
                renderSubsubcatRow();
                renderQuickAddBar();

                let filtered = affixes;
                if (currentCat !== '__all__') {
                    filtered = filtered.filter(item => (item.category || '未分类') === currentCat);
                }
                if (currentSub !== '__all__' && currentCat !== '__all__') {
                    filtered = filtered.filter(item => (item.subcategory || '') === currentSub);
                }
                if (currentSubSub !== '__all__' && currentSub !== '__all__' && currentCat !== '__all__') {
                    filtered = filtered.filter(item => (item.subsubcategory || '') === currentSubSub);
                }

                affixCountSpan.textContent = `共 ${affixes.length} 条词条` +
                    (filtered.length !== affixes.length ? `（当前显示 ${filtered.length} 条）` : '');

                grid.innerHTML = '';

                if (filtered.length === 0) {
                    const emptyDiv = document.createElement('div');
                    emptyDiv.className = 'empty-state';
                    if (affixes.length === 0) {
                        emptyDiv.innerHTML = '📭 还没有任何词条<br><span style="font-size:0.85rem;color:#4f5d72;">先点「+ 添加分类」创建一级分类，选中后会出现添加栏</span>';
                    } else {
                        emptyDiv.innerHTML = '🔍 该分类下没有词条';
                    }
                    grid.appendChild(emptyDiv);
                    return;
                }

                // 按 (category, subcategory, subsubcategory) 分类归卡片
                const groups = {};
                const groupOrder = [];
                filtered.forEach(item => {
                    const cat = item.category || '未分类';
                    const sub = item.subcategory || '';
                    const subsub = item.subsubcategory || '';
                    const key = cat + '||' + sub + '||' + subsub;
                    if (!groups[key]) {
                        groups[key] = { cat, sub, subsub, items: [] };
                        groupOrder.push(key);
                    }
                    groups[key].items.push(item);
                });

                groupOrder.forEach(key => {
                    const g = groups[key];
                    const card = document.createElement('div');
                    card.className = 'affix-card';

                    const cardHeader = document.createElement('div');
                    cardHeader.className = 'affix-card-header';

                    const catEl = document.createElement('span');
                    catEl.className = 'affix-category';
                    let pathParts = [g.cat];
                    if (g.sub) pathParts.push(g.sub);
                    if (g.subsub) pathParts.push(g.subsub);
                    const pathText = pathParts.join(' · ');
                    catEl.textContent = pathText;
                    catEl.title = pathText;

                    const headerRight = document.createElement('div');
                    headerRight.style.display = 'flex';
                    headerRight.style.alignItems = 'center';
                    headerRight.style.gap = '0.3rem';

                    const countEl = document.createElement('span');
                    countEl.style.cssText = 'font-size:0.72rem;color:#5b6a80;';
                    countEl.textContent = g.items.length + ' 条';

                    headerRight.appendChild(countEl);
                    cardHeader.appendChild(catEl);
                    cardHeader.appendChild(headerRight);

                    const contentWrap = document.createElement('div');
                    contentWrap.className = 'affix-content';

                    g.items.forEach(item => {
                        const row = createAffixRow(item);

                        if (inlineEditingId === item.id) {
                            // 行内编辑模式：替换为输入框
                            row.innerHTML = '';
                            row.style.cursor = 'default';
                            row.style.background = '#ffffff';
                            row.style.borderColor = '#2563eb';

                            const input = document.createElement('input');
                            input.className = 'inline-edit-input';
                            input.value = item.name;
                            input.addEventListener('keydown', (e) => {
                                if (e.key === 'Enter') {
                                    e.preventDefault();
                                    blurHandled = true;
                                    commitInlineEdit(item.id, input.value);
                                } else if (e.key === 'Escape') {
                                    e.preventDefault();
                                    blurHandled = true;
                                    cancelInlineEdit();
                                }
                            });
                            input.addEventListener('blur', () => {
                                if (blurHandled) { blurHandled = false; return; }
                                commitInlineEdit(item.id, input.value);
                            });
                            row.appendChild(input);
                        } else {
                            const editBtn = document.createElement('button');
                            editBtn.className = 'icon-btn edit';
                            editBtn.title = '编辑';
                            editBtn.innerHTML = '✏️';
                            editBtn.style.flexShrink = '0';
                            editBtn.addEventListener('click', (e) => {
                                e.stopPropagation();
                                startInlineEdit(item.id);
                            });

                            const delBtn = document.createElement('button');
                            delBtn.className = 'icon-btn delete';
                            delBtn.title = '删除';
                            delBtn.innerHTML = '🗑️';
                            delBtn.style.flexShrink = '0';
                            delBtn.addEventListener('click', (e) => {
                                e.stopPropagation();
                                deleteAffix(item.id);
                            });

                            row.appendChild(editBtn);
                            row.appendChild(delBtn);
                        }
                        contentWrap.appendChild(row);
                    });

                    card.appendChild(cardHeader);
                    card.appendChild(contentWrap);
                    grid.appendChild(card);
                });
            }

            function createAffixRow(item) {
                const row = document.createElement('div');
                row.className = 'affix-row';
                row.title = '点击复制：' + item.name;

                const nameEl = document.createElement('span');
                nameEl.className = 'affix-name';
                nameEl.textContent = item.name;
                row.appendChild(nameEl);

                const iconEl = document.createElement('span');
                iconEl.className = 'affix-copy-icon';
                iconEl.textContent = '📋';
                row.appendChild(iconEl);

                row.addEventListener('click', async (e) => {
                    e.stopPropagation();
                    const ok = await copyToClipboard(item.name);
                    if (ok) showToast(item.name, '📋 已复制');
                });

                return row;
            }

            // ========== 分类重命名（三级） ==========
            function renameCategory(oldName) {
                if (!oldName || oldName === '__all__') return;
                const newName = prompt('修改一级分类名称：', oldName);
                if (newName === null) return;
                const trimmed = newName.trim();
                if (!trimmed) {
                    showToast('分类名不能为空', '⚠️');
                    return;
                }
                if (trimmed === oldName) return;
                if (getAllCategories().has(trimmed)) {
                    alert('已存在同名一级分类：' + trimmed);
                    return;
                }
                let n = 0;
                affixes.forEach(a => {
                    if ((a.category || '未分类') === oldName) {
                        a.category = trimmed;
                        n++;
                    }
                });
                renameCategoryEntry(oldName, trimmed);
                if (currentCat === oldName) currentCat = trimmed;
                saveToStorage();
                render();
                showToast(`已把「${oldName}」改名为「${trimmed}」${n ? `，同步更新 ${n} 条词条` : ''}`, '✏️');
            }

            function renameSubcategory(catName, oldName) {
                if (!catName || catName === '__all__' || !oldName) return;
                const newName = prompt(`修改「${catName}」下二级分类名称：`, oldName);
                if (newName === null) return;
                const trimmed = newName.trim();
                if (!trimmed) {
                    showToast('分类名不能为空', '⚠️');
                    return;
                }
                if (trimmed === oldName) return;
                if (getSubcategoryList(catName).includes(trimmed)) {
                    if (!confirm(`「${catName}」下已存在同名分类「${trimmed}」。\n点击「确定」把「${oldName}」的词条合并到「${trimmed}」，点击「取消」放弃改名。`)) return;
                    // 合并同名分类：把旧词缀归并到新名下
                    affixes.forEach(a => {
                        if ((a.category || '未分类') === catName && (a.subcategory || '') === oldName) {
                            a.subcategory = trimmed;
                        }
                    });
                    renameSubEntry(catName, oldName, trimmed);
                    saveToStorage();
                    render();
                    showToast(`已把「${oldName}」合并到「${trimmed}」`, '✏️');
                    return;
                }
                let n = 0;
                affixes.forEach(a => {
                    if ((a.category || '未分类') === catName && (a.subcategory || '') === oldName) {
                        a.subcategory = trimmed;
                        n++;
                    }
                });
                renameSubEntry(catName, oldName, trimmed);
                if (currentCat === catName && currentSub === oldName) currentSub = trimmed;
                saveToStorage();
                render();
                showToast(`已把「${oldName}」改名为「${trimmed}」${n ? `，同步更新 ${n} 条词条` : ''}`, '✏️');
            }

            function renameSubSubcategory(catName, subName, oldName) {
                if (!catName || !subName || !oldName) return;
                const newName = prompt(`修改「${catName} · ${subName}」下三级分类名称：`, oldName);
                if (newName === null) return;
                const trimmed = newName.trim();
                if (!trimmed) {
                    showToast('分类名不能为空', '⚠️');
                    return;
                }
                if (trimmed === oldName) return;
                if (getSubsubcategoryList(catName, subName).includes(trimmed)) {
                    if (!confirm(`「${subName}」下已存在同名细分类「${trimmed}」。\n点击「确定」把「${oldName}」的词条合并到「${trimmed}」，点击「取消」放弃改名。`)) return;
                    // 合并同名细分类
                    affixes.forEach(a => {
                        if ((a.category || '未分类') === catName &&
                            (a.subcategory || '') === subName &&
                            (a.subsubcategory || '') === oldName) {
                            a.subsubcategory = trimmed;
                        }
                    });
                    renameSubSubEntry(catName, subName, oldName, trimmed);
                    saveToStorage();
                    render();
                    showToast(`已把「${oldName}」合并到「${trimmed}」`, '✏️');
                    return;
                }
                let n = 0;
                affixes.forEach(a => {
                    if ((a.category || '未分类') === catName &&
                        (a.subcategory || '') === subName &&
                        (a.subsubcategory || '') === oldName) {
                        a.subsubcategory = trimmed;
                        n++;
                    }
                });
                renameSubSubEntry(catName, subName, oldName, trimmed);
                if (currentCat === catName && currentSub === subName && currentSubSub === oldName) currentSubSub = trimmed;
                saveToStorage();
                render();
                showToast(`已把「${oldName}」改名为「${trimmed}」${n ? `，同步更新 ${n} 条词条` : ''}`, '✏️');
            }

            // ========== 快速添加 / 行内编辑 ==========
            function quickAdd() {
                const name = quickAddInput.value.trim();
                if (!name) return;
                if (currentCat === '__all__') {
                    alert('请先选择一级分类');
                    return;
                }
                const sub = currentSub === '__all__' ? '' : currentSub;
                const subsub = (currentSub !== '__all__' && currentSubSub !== '__all__') ? currentSubSub : '';
                affixes.push({
                    id: generateId(),
                    category: currentCat,
                    subcategory: sub,
                    subsubcategory: subsub,
                    name
                });
                if (sub) ensureCategory(currentCat, sub, subsub || null);
                saveToStorage();
                quickAddInput.value = '';
                quickAddInput.focus();
                render();
            }

            let inlineEditingId = null;

            function startInlineEdit(id) {
                // 如果已有其他行在编辑，先恢复
                if (inlineEditingId && inlineEditingId !== id) {
                    render();
                }
                inlineEditingId = id;
                render();
                // render 后找到对应输入框聚焦
                const input = grid.querySelector('.inline-edit-input');
                if (input) {
                    input.focus();
                    input.select();
                }
            }

            function commitInlineEdit(id, newName) {
                if (inlineEditingId !== id) return; // 防止 blur 重复触发
                const item = affixes.find(a => a.id === id);
                if (!item) { inlineEditingId = null; return; }
                const trimmed = newName.trim();
                inlineEditingId = null;
                if (!trimmed) {
                    // 空名称则删除
                    if (confirm('名称为空，是否删除该词条？')) {
                        affixes = affixes.filter(a => a.id !== id);
                        saveToStorage();
                    }
                } else {
                    item.name = trimmed;
                    saveToStorage();
                }
                render();
            }

            function cancelInlineEdit() {
                inlineEditingId = null;
                render();
            }

            // 标记 blur 是否已被处理，防止 Enter/Escape 后 blur 重复触发
            let blurHandled = false;

            function deleteAffix(id) {
                const item = affixes.find(a => a.id === id);
                if (!item) return;
                if (!confirm(`确定删除词条「${item.name}」？`)) return;
                affixes = affixes.filter(a => a.id !== id);
                saveToStorage();
                render();
                if (inlineEditingId === id) inlineEditingId = null;
            }

            function clearAll() {
                if (affixes.length === 0 && categories.length === 0) {
                    alert('已经是空的了');
                    return;
                }
                if (!confirm(`确定要清空所有 ${affixes.length} 条词条和 ${categories.length} 个分类吗？此操作不可恢复！`)) return;
                if (!confirm('再次确认：真的要全部删除吗？')) return;
                affixes = [];
                categories = [];
                currentCat = '__all__';
                currentSub = '__all__';
                currentSubSub = '__all__';
                saveToStorage();
                render();
            }

            function exportData() {
                const dataStr = JSON.stringify(affixes, null, 2);
                const blob = new Blob([dataStr], { type: 'application/json' });
                const url = URL.createObjectURL(blob);
                const a = document.createElement('a');
                const date = new Date().toISOString().slice(0, 10);
                a.href = url;
                a.download = `poe-affixes-${date}.json`;
                a.click();
                URL.revokeObjectURL(url);
                showToast('已导出 JSON 文件', '📤');
            }

            function importData() {
                const input = document.createElement('input');
                input.type = 'file';
                input.accept = '.json,application/json';
                input.addEventListener('change', (e) => {
                    const file = e.target.files[0];
                    if (!file) return;
                    const reader = new FileReader();
                    reader.onload = (ev) => {
                        try {
                            const imported = JSON.parse(ev.target.result);
                            if (!Array.isArray(imported)) {
                                alert('文件格式不正确，应为词条数组');
                                return;
                            }
                            const valid = imported.filter(item =>
                                item && typeof item.name === 'string'
                            ).map(item => ({
                                id: item.id || generateId(),
                                category: (item.category && typeof item.category === 'string') ? item.category.trim() : '未分类',
                                subcategory: (item.subcategory && typeof item.subcategory === 'string') ? item.subcategory.trim() : '',
                                subsubcategory: (item.subsubcategory && typeof item.subsubcategory === 'string') ? item.subsubcategory.trim() : '',
                                name: item.name
                            }));
                            if (valid.length === 0) {
                                alert('没有找到有效的词条数据');
                                return;
                            }
                            if (!confirm(`即将导入 ${valid.length} 条词条。\n当前已有 ${affixes.length} 条。是否继续？`)) return;
                            affixes = affixes.concat(valid);
                            // 同步导入的分类到独立 categories 结构
                            valid.forEach(item => {
                                ensureCategory(item.category, item.subcategory || null, item.subsubcategory || null);
                            });
                            saveToStorage();
                            render();
                            showToast(`成功导入 ${valid.length} 条`, '📥');
                        } catch (err) {
                            alert('解析文件失败：' + err.message);
                        }
                    };
                    reader.readAsText(file);
                });
                input.click();
            }

            // ========== 事件绑定 ==========
            function bindEvents() {
                // 快速添加：回车提交
                quickAddInput.addEventListener('keydown', (e) => {
                    if (e.key === 'Enter') {
                        e.preventDefault();
                        quickAdd();
                    }
                });

                exportBtn.addEventListener('click', exportData);
                importBtn.addEventListener('click', importData);
                clearAllBtn.addEventListener('click', clearAll);

                // 一级分类点击
                catNav.addEventListener('click', (e) => {
                    const btn = e.target.closest('.cat-btn');
                    if (!btn) return;
                    if (btn.dataset.cat === undefined) return;
                    currentCat = btn.dataset.cat;
                    currentSub = '__all__';
                    currentSubSub = '__all__';
                    render();
                });

                // 二级分类点击
                subcatRow.addEventListener('click', (e) => {
                    const btn = e.target.closest('.subcat-btn');
                    if (!btn) return;
                    if (btn.dataset.sub === undefined) return;
                    currentSub = btn.dataset.sub;
                    currentSubSub = '__all__';
                    render();
                });

                // 三级分类点击
                subsubcatRow.addEventListener('click', (e) => {
                    const btn = e.target.closest('.subsubcat-btn');
                    if (!btn) return;
                    if (btn.dataset.subsub === undefined) return;
                    currentSubSub = btn.dataset.subsub;
                    render();
                });

                // 云同步
                pushBtn.addEventListener('click', pushCloud);
                pullBtn.addEventListener('click', pullCloud);
                syncPasswordInput.addEventListener('keydown', (e) => {
                    if (e.key === 'Enter') {
                        e.preventDefault();
                        pushCloud();
                    }
                });

                // 快速添加按钮
                quickAddBtn.addEventListener('click', quickAdd);

                toast.addEventListener('click', () => {
                    toast.classList.remove('show');
                    if (toastTimer) clearTimeout(toastTimer);
                });
            }

            // ========== 启动 ==========
            function init() {
                loadFromStorage();
                bindEvents();

                // 恢复密码
                try {
                    const saved = localStorage.getItem(PWD_KEY);
                    if (saved) {
                        syncPasswordInput.value = saved;
                        cloudPassword = saved;
                    }
                } catch (e) {}

                render();
            }

            init();
        })();
    </script>
</body>
</html>
