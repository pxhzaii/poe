<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>娴佹斁涔嬭矾 路 鎴戠殑璇嶇紑搴?/title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: system-ui, 'Segoe UI', Roboto, 'Helvetica Neue', sans-serif;
        }

        body {
            background: #0b0e14;
            color: #e3e6ed;
            padding: 2rem 1.5rem;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .container {
            max-width: 1100px;
            width: 100%;
        }

        /* 澶撮儴 */
        .header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            flex-wrap: wrap;
            gap: 1rem;
            margin-bottom: 1.8rem;
            border-bottom: 1px solid #2a2f3a;
            padding-bottom: 1rem;
        }

        .header h1 {
            font-weight: 400;
            font-size: 1.6rem;
            letter-spacing: 1px;
            color: #c9b578;
            text-shadow: 0 0 6px rgba(201, 181, 120, 0.3);
        }

        .header-actions {
            display: flex;
            gap: 0.6rem;
            flex-wrap: wrap;
        }

        /* 閫氱敤鎸夐挳 */
        .btn {
            background: #1e2530;
            border: 1px solid #2e3848;
            color: #c3cddf;
            padding: 0.5rem 1.1rem;
            border-radius: 30px;
            font-size: 0.88rem;
            cursor: pointer;
            transition: all 0.12s;
            font-weight: 400;
            letter-spacing: 0.2px;
            display: inline-flex;
            align-items: center;
            gap: 0.4rem;
        }

        .btn:hover {
            background: #2a3442;
            border-color: #4d6180;
            color: #eaf0ff;
        }

        .btn-primary {
            background: #2f4155;
            border-color: #a58e4a;
            color: #f2e9d8;
        }

        .btn-primary:hover {
            background: #3c5168;
            border-color: #c9b578;
            box-shadow: 0 0 12px rgba(201, 181, 120, 0.25);
        }

        .btn-danger {
            background: #2a1e22;
            border-color: #5e3038;
            color: #e0a8b0;
        }

        .btn-danger:hover {
            background: #3d262c;
            border-color: #8a4550;
            color: #ffc8d0;
        }

        /* 娣诲姞琛ㄥ崟 */
        .add-form {
            background: #10161f;
            border: 1px solid #232b37;
            border-radius: 16px;
            padding: 1.2rem 1.2rem 1rem;
            margin-bottom: 1.8rem;
            display: none;
        }

        .add-form.show {
            display: block;
        }

        .form-title {
            font-size: 0.95rem;
            color: #c9b578;
            margin-bottom: 0.9rem;
            font-weight: 400;
            letter-spacing: 0.5px;
        }

        .form-row {
            display: flex;
            flex-wrap: wrap;
            gap: 0.8rem;
            align-items: flex-end;
        }

        .form-group {
            display: flex;
            flex-direction: column;
            gap: 0.35rem;
            flex: 1 0 150px;
        }

        .form-group label {
            font-size: 0.75rem;
            color: #7e8b9f;
            letter-spacing: 0.5px;
            text-transform: uppercase;
        }

        .form-group input,
        .form-group select {
            background: #181f2b;
            border: 1px solid #2b3546;
            color: #e3e6ed;
            padding: 0.55rem 0.9rem;
            border-radius: 30px;
            font-size: 0.92rem;
            outline: none;
            transition: border-color 0.12s;
        }

        .form-group input:focus,
        .form-group select:focus {
            border-color: #a58e4a;
            box-shadow: 0 0 8px rgba(201, 181, 120, 0.2);
        }

        .form-group input::placeholder {
            color: #4f5d72;
        }

        .form-actions {
            display: flex;
            gap: 0.6rem;
            margin-top: 0.9rem;
        }

        /* 绛涢€夋爮 */
        .filter-section {
            display: flex;
            flex-wrap: wrap;
            gap: 0.7rem;
            margin-bottom: 1.5rem;
            align-items: center;
        }

        .filter-btn {
            background: #181f2b;
            border: 1px solid #2b3546;
            color: #b3bed5;
            padding: 0.45rem 1.2rem;
            border-radius: 30px;
            font-size: 0.88rem;
            cursor: pointer;
            transition: all 0.1s;
            font-weight: 400;
            letter-spacing: 0.2px;
        }

        .filter-btn:hover {
            background: #1f2a38;
            border-color: #4d6180;
            color: #dee8ff;
        }

        .filter-btn.active {
            background: #2f4155;
            border-color: #a58e4a;
            color: #f2e9d8;
            box-shadow: 0 0 10px rgba(201, 181, 120, 0.2);
        }

        /* 缁熻 */
        .stats-bar {
            font-size: 0.85rem;
            color: #6b7a92;
            margin-bottom: 1rem;
            display: flex;
            justify-content: space-between;
            flex-wrap: wrap;
            gap: 0.5rem;
        }

        /* 璇嶇紑缃戞牸 */
        .affix-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(290px, 1fr));
            gap: 1rem;
        }

        /* 鍗＄墖 */
        .affix-card {
            background: #10161f;
            border: 1px solid #232b37;
            border-radius: 14px;
            padding: 1rem 1rem 1rem;
            transition: border 0.15s, background 0.15s;
            display: flex;
            flex-direction: column;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.4);
            position: relative;
        }

        .affix-card:hover {
            border-color: #3c4b5e;
            background: #121a24;
        }

        .affix-card-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 0.7rem;
        }

        .affix-category {
            font-size: 0.68rem;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: #7e8b9f;
            font-weight: 500;
            background: #1a212c;
            padding: 0.2rem 0.7rem;
            border-radius: 20px;
            max-width: 60%;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        /* 鍗＄墖鎿嶄綔鎸夐挳 */
        .card-actions {
            display: flex;
            gap: 0.3rem;
            opacity: 0.4;
            transition: opacity 0.15s;
        }

        .affix-card:hover .card-actions {
            opacity: 1;
        }

        .icon-btn {
            background: transparent;
            border: none;
            color: #6b7a92;
            cursor: pointer;
            font-size: 0.95rem;
            padding: 0.25rem 0.4rem;
            border-radius: 6px;
            transition: all 0.1s;
            line-height: 1;
        }

        .icon-btn:hover {
            background: #1f2a38;
            color: #e3e6ed;
        }

        .icon-btn.delete:hover {
            background: #3d262c;
            color: #ff9aa8;
        }

        /* ========== 鍚嶇О + 鏁板€?骞跺垪瀹瑰櫒 ========== */
        .affix-content {
            display: flex;
            flex-direction: column;
            gap: 0.6rem;
            margin-top: 0.2rem;
        }

        /* 閫氱敤澶嶅埗椤规牱寮忥紙鍚嶇О涓庢暟鍊煎畬鍏ㄤ竴鑷达級 */
        .copy-item {
            display: flex;
            align-items: center;
            gap: 0.5rem;
            background: #1a212c;
            border: 1px solid #2b3546;
            border-radius: 10px;
            padding: 0.6rem 0.8rem;
            cursor: pointer;
            transition: all 0.12s;
            user-select: none;
            position: relative;
        }

        .copy-item:hover {
            background: #212c3b;
            border-color: #a58e4a;
            box-shadow: 0 0 10px rgba(201, 181, 120, 0.15);
        }

        .copy-item:active {
            transform: scale(0.995);
            background: #283545;
        }

        /* 鍐呭鏂囧瓧 */
        .copy-item-text {
            flex: 1;
            font-size: 1rem;
            font-weight: 400;
            letter-spacing: 0.3px;
            color: #e3e6ed;
            word-break: break-word;
            line-height: 1.4;
        }

        /* 澶嶅埗灏忓浘鏍?*/
        .copy-item-icon {
            font-size: 0.9rem;
            opacity: 0.4;
            transition: opacity 0.12s, color 0.12s;
            flex-shrink: 0;
        }

        .copy-item:hover .copy-item-icon {
            opacity: 1;
            color: #c9b578;
        }

        /* 鍚嶇О鐗规畩涓€鐐癸細璁╁畠涓嶈嚦浜庡畬鍏ㄤ竴鏍凤紝浣嗗悓鏍峰ぇ灏?*/
        .copy-item.name .copy-item-text {
            color: #f0e6d2;
            font-weight: 450;
        }

        .copy-item.value .copy-item-text {
            font-family: 'JetBrains Mono', 'Fira Code', 'Cascadia Code', monospace;
            font-size: 1rem;
            color: #f0e6d2;
        }

        /* 绌虹姸鎬?*/
        .empty-state {
            grid-column: 1 / -1;
            text-align: center;
            padding: 3rem 1rem;
            color: #5b6a80;
            border: 1px dashed #2b3546;
            border-radius: 20px;
            background: #0e131b;
            font-size: 1rem;
            line-height: 1.8;
        }

        /* 澶嶅埗鍙嶉 */
        .toast {
            position: fixed;
            top: 30px;
            left: 50%;
            transform: translateX(-50%) scale(0.95);
            background: #2a3b4c;
            color: #e0e9ff;
            padding: 0.7rem 1.8rem;
            border-radius: 40px;
            font-size: 0.95rem;
            letter-spacing: 0.3px;
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.7);
            border: 1px solid #4a6180;
            opacity: 0;
            transition: opacity 0.15s, transform 0.15s;
            pointer-events: none;
            z-index: 999;
            backdrop-filter: blur(6px);
            max-width: 90vw;
            word-break: break-all;
            text-align: center;
        }

        .toast.show {
            opacity: 1;
            transform: translateX(-50%) scale(1);
        }

        /* 搴曢儴 */
        .footer-note {
            margin-top: 2.5rem;
            color: #4b5a70;
            font-size: 0.78rem;
            text-align: center;
            border-top: 1px solid #1d2530;
            padding-top: 1.5rem;
            line-height: 1.8;
        }

        /* 鍚屾瀵嗙爜杈撳叆妗?*/
        .sync-key-input:focus {
            border-color: #a58e4a;
            box-shadow: 0 0 8px rgba(201, 181, 120, 0.2);
        }

        /* KV 闈㈡澘 */
        .kv-panel {
            background: #10161f;
            border: 1px solid #232b37;
            border-radius: 16px;
            padding: 1rem 1.2rem;
            margin-bottom: 1.8rem;
            display: none;
        }

        .kv-panel.show {
            display: block;
        }

        .kv-panel .kv-title {
            font-size: 0.95rem;
            color: #c9b578;
            margin-bottom: 0.9rem;
            font-weight: 400;
            letter-spacing: 0.5px;
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        .kv-row {
            display: flex;
            flex-wrap: wrap;
            gap: 0.8rem;
            margin-bottom: 0.8rem;
        }

        .kv-row .kv-field {
            flex: 1 0 280px;
            display: flex;
            flex-direction: column;
            gap: 0.35rem;
        }

        .kv-field label {
            font-size: 0.72rem;
            color: #7e8b9f;
            letter-spacing: 0.3px;
        }

        .kv-field input {
            background: #181f2b;
            border: 1px solid #2b3546;
            color: #e3e6ed;
            padding: 0.5rem 0.9rem;
            border-radius: 30px;
            font-size: 0.88rem;
            outline: none;
        }

        .kv-field input:focus {
            border-color: #a58e4a;
            box-shadow: 0 0 8px rgba(201, 181, 120, 0.2);
        }

        .kv-actions {
            display: flex;
            gap: 0.6rem;
            flex-wrap: wrap;
            align-items: center;
        }

        .kv-status {
            font-size: 0.78rem;
            color: #5b6a80;
        }

        .kv-status.ok { color: #7fbf7f; }
        .kv-status.err { color: #e08a8a; }

        @media (max-width: 600px) {
            body { padding: 1.2rem 0.8rem; }
            .header h1 { font-size: 1.25rem; }
            .affix-grid { grid-template-columns: 1fr; }
            .form-row { flex-direction: column; align-items: stretch; }
        }
    </style>
</head>
<body>
    <div class="container">
        <!-- 澶撮儴 -->
        <div class="header">
            <h1>鈿旓笍 娴佹斁涔嬭矾 路 鎴戠殑璇嶇紑搴?/h1>
            <div class="header-actions">
                <button class="btn btn-primary" id="toggleAddForm">鉃?娣诲姞璇嶇紑</button>
                <input type="password" id="syncKeyInput" class="sync-key-input" placeholder="鍚屾瀵嗙爜" autocomplete="off" style="width:90px;height:36px;border-radius:30px;border:1px solid #2b3546;background:#181f2b;color:#e3e6ed;padding:0 0.8rem;font-size:0.82rem;outline:none;">
                <button class="btn" id="pushCloudBtn" title="鎶婂綋鍓嶈瘝缂€鎺ㄩ€佸埌浜戠澶囦唤">鈽侊笍 鎺ㄩ€佷簯绔?/button>
                <button class="btn" id="pullCloudBtn" title="鐢ㄤ簯绔暟鎹鐩栨湰鍦?>猬囷笍 鎷夊彇浜戠</button>
                <button class="btn" id="exportBtn">馃摛 瀵煎嚭</button>
                <button class="btn" id="importBtn">馃摜 瀵煎叆</button>
                <button class="btn btn-danger" id="clearAllBtn">馃棏锔?娓呯┖</button>
            </div>
        </div>

        <!-- 娣诲姞/缂栬緫琛ㄥ崟 -->
        <div class="add-form" id="addForm">
            <div class="form-title" id="formTitle">鉁?娣诲姞鏂拌瘝缂€</div>
            <div class="form-row">
                <div class="form-group">
                    <label>鍒嗙被</label>
                    <input type="text" id="inputCategory" list="categoryList" placeholder="渚嬪锛氳礋鐢电敳/鍙敜琛?鎴?娉曡/鎴掓寚" autocomplete="off">
                    <datalist id="categoryList"></datalist>
                </div>
                <div class="form-group" style="flex: 2 0 200px;">
                    <label>璇嶇紑鍚嶇О</label>
                    <input type="text" id="inputName" placeholder="渚嬪锛氬鍔犳渶澶х敓鍛? autocomplete="off">
                </div>
                <div class="form-group">
                    <label>鏁板€?/ 鍐呭</label>
                    <input type="text" id="inputValue" placeholder="渚嬪锛?2222" autocomplete="off">
                </div>
            </div>
            <div class="form-actions">
                <button class="btn btn-primary" id="saveAffixBtn">馃捑 淇濆瓨</button>
                <button class="btn" id="cancelFormBtn">鍙栨秷</button>
            </div>
        </div>

        <!-- 绛涢€夋爮 -->
        <div class="filter-section" id="filterSection">
            <button class="filter-btn active" data-filter="__all__">鍏ㄩ儴</button>
        </div>

        <!-- 缁熻 -->
        <div class="stats-bar">
            <span id="affixCount">鍏?0 鏉¤瘝缂€</span>
            <span style="font-size:0.78rem; color:#5b6a80;">鏁版嵁淇濆瓨鍦ㄦ湰鍦版祻瑙堝櫒 路 鐐瑰嚮鍚嶇О鎴栨暟鍊煎潎鍙鍒?/span>
        </div>

        <!-- 璇嶇紑缃戞牸 -->
        <div class="affix-grid" id="affixGrid"></div>

        <!-- 搴曢儴 -->
        <div class="footer-note">
            <span>鍚嶇О涓庢暟鍊煎苟鍒?路 鐐瑰嚮浠绘剰涓€涓兘鑳藉鍒?路 鍒嗙被鍙嚜瀹氫箟 路 浜戠鍚屾闇€杈撳叆瀵嗙爜 路 寤鸿瀹氭湡瀵煎嚭澶囦唤</span>
        </div>
    </div>

    <!-- 澶嶅埗鍙嶉 -->
    <div class="toast" id="toast">馃搵 宸插鍒? <span id="toastValue"></span></div>

    <script>
        (function() {
            const STORAGE_KEY = 'poe_my_affixes_v2';

            let affixes = [];
            let currentFilter = '__all__';
            let editingId = null;
            let syncing = false;

            const grid = document.getElementById('affixGrid');
            const toast = document.getElementById('toast');
            const toastValueSpan = document.getElementById('toastValue');
            const affixCountSpan = document.getElementById('affixCount');
            const filterSection = document.getElementById('filterSection');
            const addForm = document.getElementById('addForm');
            const formTitle = document.getElementById('formTitle');
            const inputCategory = document.getElementById('inputCategory');
            const inputName = document.getElementById('inputName');
            const inputValue = document.getElementById('inputValue');
            const categoryList = document.getElementById('categoryList');
            const toggleAddFormBtn = document.getElementById('toggleAddForm');
            const saveAffixBtn = document.getElementById('saveAffixBtn');
            const cancelFormBtn = document.getElementById('cancelFormBtn');
            const exportBtn = document.getElementById('exportBtn');
            const importBtn = document.getElementById('importBtn');
            const clearAllBtn = document.getElementById('clearAllBtn');
            const pushCloudBtn = document.getElementById('pushCloudBtn');
            const pullCloudBtn = document.getElementById('pullCloudBtn');
            const syncKeyInput = document.getElementById('syncKeyInput');

            function generateId() {
                return Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
            }

            function loadFromStorage() {
                try {
                    const raw = localStorage.getItem(STORAGE_KEY);
                    if (raw) {
                        const parsed = JSON.parse(raw);
                        if (Array.isArray(parsed)) {
                            affixes = parsed;
                            return;
                        }
                    }
                } catch (e) {
                    console.warn('璇诲彇鏈湴鏁版嵁澶辫触', e);
                }
                affixes = [];
                saveToStorage();
            }

            function saveToStorage() {
                try {
                    localStorage.setItem(STORAGE_KEY, JSON.stringify(affixes));
                } catch (e) {
                    console.error('淇濆瓨鏈湴鏁版嵁澶辫触', e);
                    alert('淇濆瓨澶辫触锛屽彲鑳芥槸娴忚鍣ㄥ瓨鍌ㄧ┖闂翠笉瓒虫垨琚鐢ㄣ€?);
                }
            }

            async function copyToClipboard(text) {
                if (navigator.clipboard && navigator.clipboard.writeText) {
                    try {
                        await navigator.clipboard.writeText(text);
                        return true;
                    } catch (err) {
                        console.warn('clipboard API 澶辫触锛屽皾璇曢檷绾?, err);
                    }
                }
                try {
                    const textarea = document.createElement('textarea');
                    textarea.value = text;
                    textarea.style.position = 'fixed';
                    textarea.style.opacity = '0';
                    textarea.style.left = '-9999px';
                    document.body.appendChild(textarea);
                    textarea.focus();
                    textarea.select();
                    const success = document.execCommand('copy');
                    document.body.removeChild(textarea);
                    return success;
                } catch (err) {
                    console.error('澶嶅埗澶辫触', err);
                    return false;
                }
            }

            let toastTimer = null;
            function showToast(message, prefix = '馃搵 宸插鍒?) {
                toastValueSpan.textContent = message;
                toast.childNodes[0].textContent = prefix + ': ';
                toast.classList.add('show');
                if (toastTimer) clearTimeout(toastTimer);
                toastTimer = setTimeout(() => {
                    toast.classList.remove('show');
                }, 1600);
            }

            function getAllCategories() {
                const set = new Set();
                affixes.forEach(item => {
                    if (item.category && item.category.trim()) {
                        set.add(item.category.trim());
                    }
                });
                return Array.from(set).sort();
            }

            function updateCategoryDatalist() {
                const categories = getAllCategories();
                categoryList.innerHTML = '';
                categories.forEach(cat => {
                    const option = document.createElement('option');
                    option.value = cat;
                    categoryList.appendChild(option);
                });
            }

            function renderFilterButtons() {
                const allBtn = filterSection.querySelector('[data-filter="__all__"]');
                filterSection.innerHTML = '';
                filterSection.appendChild(allBtn);

                const categories = getAllCategories();
                categories.forEach(cat => {
                    const btn = document.createElement('button');
                    btn.className = 'filter-btn';
                    btn.dataset.filter = cat;
                    btn.textContent = cat;
                    filterSection.appendChild(btn);
                });

                if (currentFilter !== '__all__' && !categories.includes(currentFilter)) {
                    currentFilter = '__all__';
                }

                document.querySelectorAll('.filter-btn').forEach(btn => btn.classList.remove('active'));
                const activeBtn = document.querySelector(`.filter-btn[data-filter="${currentFilter}"]`);
                if (activeBtn) activeBtn.classList.add('active');
                else {
                    currentFilter = '__all__';
                    allBtn.classList.add('active');
                }
            }

            function bindFilterEvents() {
                filterSection.addEventListener('click', (e) => {
                    const btn = e.target.closest('.filter-btn');
                    if (!btn) return;
                    const filter = btn.dataset.filter;
                    if (filter === undefined) return;
                    currentFilter = filter;
                    render();
                });
            }

            function escapeHtml(text) {
                const div = document.createElement('div');
                div.textContent = text;
                return div.innerHTML;
            }

            function createCopyItem(text, type) {
                const item = document.createElement('div');
                item.className = `copy-item ${type}`;
                item.title = `鐐瑰嚮澶嶅埗${type === 'name' ? '鍚嶇О' : '鏁板€?}`;

                const textEl = document.createElement('span');
                textEl.className = 'copy-item-text';
                textEl.textContent = text;

                const iconEl = document.createElement('span');
                iconEl.className = 'copy-item-icon';
                iconEl.textContent = '馃搵';

                item.appendChild(textEl);
                item.appendChild(iconEl);

                item.addEventListener('click', async (e) => {
                    e.stopPropagation();
                    const ok = await copyToClipboard(text);
                    if (ok) {
                        showToast(
                            text,
                            type === 'name' ? '馃搵 宸插鍒跺悕绉? : '馃搵 宸插鍒舵暟鍊?
                        );
                    }
                });

                return item;
            }

            // ---------- 浜戝悓姝ワ紙鏈嶅姟绔?/api/gist/data锛屾棤闇€浠讳綍閰嶇疆锛?----------
            function getSyncKey() {
                return (syncKeyInput.value || '').trim();
            }

            async function cloudFetch(method, body) {
                const opts = { method, headers: {} };
                opts.headers['X-Sync-Key'] = getSyncKey();
                if (body !== undefined) {
                    opts.headers['Content-Type'] = 'application/json';
                    opts.body = JSON.stringify(body);
                }
                const resp = await fetch('/api/gist/data', opts);
                const text = await resp.text();
                let data = null;
                try { data = text ? JSON.parse(text) : null; } catch (e) {}
                if (!resp.ok) {
                    const msg = (data && data.message) ? data.message : ('HTTP ' + resp.status);
                    throw new Error(msg);
                }
                return data;
            }

            async function pushCloud() {
                if (syncing) return;
                if (location.protocol === 'file:') {
                    alert('鏈湴鏂囦欢妯″紡涓嶆敮鎸佷簯鍚屾锛岃浣跨敤绾夸笂鐗堬細\nhttps://poe-affix.pages.dev');
                    return;
                }
                if (!getSyncKey()) {
                    alert('璇峰厛杈撳叆鍚屾瀵嗙爜');
                    syncKeyInput.focus();
                    return;
                }
                if (!confirm(`灏嗗綋鍓?${affixes.length} 鏉¤瘝缂€鎺ㄩ€佸埌浜戠锛堣鐩栦簯绔棫鏁版嵁锛夛紝缁х画锛焋)) return;
                syncing = true;
                const oldText = pushCloudBtn.textContent;
                pushCloudBtn.textContent = '鈴?鎺ㄩ€佷腑鈥?;
                pushCloudBtn.disabled = true;
                try {
                    const res = await cloudFetch('POST', { affixes: affixes });
                    showToast('宸叉帹閫?' + (res.count != null ? res.count : affixes.length) + ' 鏉″埌浜戠', '鈽侊笍');
                } catch (err) {
                    alert('鎺ㄩ€佸け璐ワ細' + err.message);
                } finally {
                    syncing = false;
                    pushCloudBtn.textContent = oldText;
                    pushCloudBtn.disabled = false;
                }
            }

            async function pullCloud() {
                if (syncing) return;
                if (location.protocol === 'file:') {
                    alert('鏈湴鏂囦欢妯″紡涓嶆敮鎸佷簯鍚屾锛岃浣跨敤绾夸笂鐗堬細\nhttps://poe-affix.pages.dev');
                    return;
                }
                if (!getSyncKey()) {
                    alert('璇峰厛杈撳叆鍚屾瀵嗙爜');
                    syncKeyInput.focus();
                    return;
                }
                syncing = true;
                const oldText = pullCloudBtn.textContent;
                pullCloudBtn.textContent = '鈴?鎷夊彇涓€?;
                pullCloudBtn.disabled = true;
                try {
                    const res = await cloudFetch('GET');
                    const remote = (res && res.affixes != null) ? res.affixes : [];
                    const when = res && res.updated_at ? res.updated_at.slice(0, 19).replace('T', ' ') : '';
                    if (remote.length === 0) {
                        alert('浜戠娌℃湁鏁版嵁');
                    } else {
                        affixes = remote;
                        saveToStorage();
                        render();
                        showToast('宸叉媺鍙?' + remote.length + ' 鏉¤瘝缂€' + (when ? '锛? + when + '锛? : ''), '猬囷笍');
                    }
                } catch (err) {
                    alert('鎷夊彇澶辫触锛? + err.message);
                } finally {
                    syncing = false;
                    pullCloudBtn.textContent = oldText;
                    pullCloudBtn.disabled = false;
                }
            }

            // ---------- 娓叉煋 ----------
            function render() {
                updateCategoryDatalist();
                renderFilterButtons();

                const filtered = currentFilter === '__all__'
                    ? affixes
                    : affixes.filter(item => item.category === currentFilter);

                affixCountSpan.textContent = `鍏?${affixes.length} 鏉¤瘝缂€` +
                    (currentFilter !== '__all__' ? `锛堝綋鍓嶆樉绀?${filtered.length} 鏉★級` : '');

                grid.innerHTML = '';

                if (filtered.length === 0) {
                    const emptyDiv = document.createElement('div');
                    emptyDiv.className = 'empty-state';
                    if (affixes.length === 0) {
                        emptyDiv.innerHTML = '馃摥 杩樻病鏈変换浣曡瘝缂€<br><span style="font-size:0.85rem;color:#4f5d72;">鐐瑰嚮鍙充笂瑙掋€屾坊鍔犺瘝缂€銆嶅紑濮嬪垱寤猴紝鍒嗙被鍙嚜瀹氫箟</span>';
                    } else {
                        emptyDiv.innerHTML = '馃攳 璇ュ垎绫讳笅娌℃湁璇嶇紑';
                    }
                    grid.appendChild(emptyDiv);
                    return;
                }

                filtered.forEach(item => {
                    const card = document.createElement('div');
                    card.className = 'affix-card';
                    card.dataset.id = item.id;

                    // 澶撮儴锛氬垎绫?+ 鎿嶄綔鎸夐挳
                    const cardHeader = document.createElement('div');
                    cardHeader.className = 'affix-card-header';

                    const catEl = document.createElement('span');
                    catEl.className = 'affix-category';
                    catEl.textContent = item.category || '鏈垎绫?;
                    catEl.title = item.category || '鏈垎绫?;

                    const actions = document.createElement('div');
                    actions.className = 'card-actions';

                    const editBtn = document.createElement('button');
                    editBtn.className = 'icon-btn edit';
                    editBtn.title = '缂栬緫';
                    editBtn.innerHTML = '鉁忥笍';
                    editBtn.addEventListener('click', (e) => {
                        e.stopPropagation();
                        startEdit(item.id);
                    });

                    const delBtn = document.createElement('button');
                    delBtn.className = 'icon-btn delete';
                    delBtn.title = '鍒犻櫎';
                    delBtn.innerHTML = '馃棏锔?;
                    delBtn.addEventListener('click', (e) => {
                        e.stopPropagation();
                        deleteAffix(item.id);
                    });

                    actions.appendChild(editBtn);
                    actions.appendChild(delBtn);

                    cardHeader.appendChild(catEl);
                    cardHeader.appendChild(actions);

                    // ========== 鍚嶇О + 鏁板€?骞跺垪 ==========
                    const contentWrap = document.createElement('div');
                    contentWrap.className = 'affix-content';

                    const nameItem = createCopyItem(item.name, 'name');
                    const valueItem = createCopyItem(item.value, 'value');

                    contentWrap.appendChild(nameItem);
                    contentWrap.appendChild(valueItem);

                    card.appendChild(cardHeader);
                    card.appendChild(contentWrap);

                    grid.appendChild(card);
                });
            }

            function openAddForm() {
                editingId = null;
                formTitle.textContent = '鉁?娣诲姞鏂拌瘝缂€';
                inputCategory.value = '';
                inputName.value = '';
                inputValue.value = '';
                addForm.classList.add('show');
                inputName.focus();
            }

            function closeForm() {
                addForm.classList.remove('show');
                editingId = null;
                inputName.value = '';
                inputValue.value = '';
            }

            function startEdit(id) {
                const item = affixes.find(a => a.id === id);
                if (!item) return;
                editingId = id;
                formTitle.textContent = '鉁忥笍 缂栬緫璇嶇紑';
                inputCategory.value = item.category || '';
                inputName.value = item.name;
                inputValue.value = item.value;
                addForm.classList.add('show');
                inputName.focus();
                addForm.scrollIntoView({ behavior: 'smooth', block: 'center' });
            }

            function saveAffix() {
                const category = inputCategory.value.trim();
                const name = inputName.value.trim();
                const value = inputValue.value.trim();

                if (!category) {
                    alert('璇疯緭鍏ュ垎绫伙紙渚嬪锛氳礋鐢电敳/鍙敜琛ｃ€佹硶琛€/鎴掓寚锛?);
                    inputCategory.focus();
                    return;
                }
                if (!name) {
                    alert('璇疯緭鍏ヨ瘝缂€鍚嶇О');
                    inputName.focus();
                    return;
                }
                if (!value) {
                    alert('璇疯緭鍏ユ暟鍊?鍐呭');
                    inputValue.focus();
                    return;
                }

                if (editingId) {
                    const index = affixes.findIndex(a => a.id === editingId);
                    if (index !== -1) {
                        affixes[index] = { ...affixes[index], category, name, value };
                    }
                } else {
                    affixes.push({
                        id: generateId(),
                        category,
                        name,
                        value
                    });
                }

                saveToStorage();
                render();
                closeForm();
            }

            function deleteAffix(id) {
                const item = affixes.find(a => a.id === id);
                if (!item) return;
                if (!confirm(`纭畾鍒犻櫎璇嶇紑銆?{item.name}銆嶏紵`)) return;
                affixes = affixes.filter(a => a.id !== id);
                saveToStorage();
                render();
                if (editingId === id) closeForm();
            }

            function clearAll() {
                if (affixes.length === 0) {
                    alert('宸茬粡鏄┖鐨勪簡');
                    return;
                }
                if (!confirm(`纭畾瑕佹竻绌烘墍鏈?${affixes.length} 鏉¤瘝缂€鍚楋紵姝ゆ搷浣滀笉鍙仮澶嶏紒`)) return;
                if (!confirm('鍐嶆纭锛氱湡鐨勮鍏ㄩ儴鍒犻櫎鍚楋紵')) return;
                affixes = [];
                saveToStorage();
                render();
                closeForm();
            }

            function exportData() {
                const dataStr = JSON.stringify(affixes, null, 2);
                const blob = new Blob([dataStr], { type: 'application/json' });
                const url = URL.createObjectURL(blob);
                const a = document.createElement('a');
                const date = new Date().toISOString().slice(0, 10);
                a.href = url;
                a.download = `poe-affixes-${date}.json`;
                a.click();
                URL.revokeObjectURL(url);
                showToast('宸插鍑?JSON 鏂囦欢', '馃摛');
            }

            function importData() {
                const input = document.createElement('input');
                input.type = 'file';
                input.accept = '.json,application/json';
                input.addEventListener('change', (e) => {
                    const file = e.target.files[0];
                    if (!file) return;
                    const reader = new FileReader();
                    reader.onload = (ev) => {
                        try {
                            const imported = JSON.parse(ev.target.result);
                            if (!Array.isArray(imported)) {
                                alert('鏂囦欢鏍煎紡涓嶆纭紝搴斾负璇嶇紑鏁扮粍');
                                return;
                            }
                            const valid = imported.filter(item =>
                                item && typeof item.name === 'string' && typeof item.value === 'string'
                            ).map(item => ({
                                id: item.id || generateId(),
                                category: (item.category && typeof item.category === 'string') ? item.category.trim() : '鏈垎绫?,
                                name: item.name,
                                value: item.value
                            }));
                            if (valid.length === 0) {
                                alert('娌℃湁鎵惧埌鏈夋晥鐨勮瘝缂€鏁版嵁');
                                return;
                            }
                            if (!confirm(`鍗冲皢瀵煎叆 ${valid.length} 鏉¤瘝缂€銆俓n褰撳墠宸叉湁 ${affixes.length} 鏉★紝瀵煎叆鍚庢€绘暟灏嗕负 ${affixes.length + valid.length} 鏉°€傛槸鍚︾户缁紵`)) return;
                            affixes = affixes.concat(valid);
                            saveToStorage();
                            render();
                            showToast(`鎴愬姛瀵煎叆 ${valid.length} 鏉, '馃摜');
                        } catch (err) {
                            alert('瑙ｆ瀽鏂囦欢澶辫触锛? + err.message);
                        }
                    };
                    reader.readAsText(file);
                });
                input.click();
            }

            function bindEvents() {
                toggleAddFormBtn.addEventListener('click', () => {
                    if (addForm.classList.contains('show')) {
                        closeForm();
                    } else {
                        openAddForm();
                    }
                });

                saveAffixBtn.addEventListener('click', saveAffix);
                cancelFormBtn.addEventListener('click', closeForm);

                inputName.addEventListener('keydown', (e) => {
                    if (e.key === 'Enter') {
                        e.preventDefault();
                        inputValue.focus();
                    }
                });
                inputValue.addEventListener('keydown', (e) => {
                    if (e.key === 'Enter') {
                        e.preventDefault();
                        saveAffix();
                    }
                });

                // 浜戝悓姝?                pushCloudBtn.addEventListener('click', pushCloud);
                pullCloudBtn.addEventListener('click', pullCloud);

                exportBtn.addEventListener('click', exportData);
                importBtn.addEventListener('click', importData);
                clearAllBtn.addEventListener('click', clearAll);

                toast.addEventListener('click', () => {
                    toast.classList.remove('show');
                    if (toastTimer) clearTimeout(toastTimer);
                });

                bindFilterEvents();
            }

            function init() {
                loadFromStorage();
                // 鍥炲～鍚屾瀵嗙爜
                try {
                    const savedKey = localStorage.getItem('poe_sync_key');
                    if (savedKey) syncKeyInput.value = savedKey;
                } catch (e) {}
                syncKeyInput.addEventListener('change', function() {
                    try { localStorage.setItem('poe_sync_key', getSyncKey()); } catch (e) {}
                });
                syncKeyInput.addEventListener('blur', function() {
                    try { localStorage.setItem('poe_sync_key', getSyncKey()); } catch (e) {}
                });
                bindEvents();
                render();
            }

            init();
        })();
    </script>
</body>
</html>
