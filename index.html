<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>流放之路 · 我的词缀库</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: system-ui, 'Segoe UI', Roboto, 'Helvetica Neue', sans-serif;
        }

        body {
            background: #0b0e14;
            color: #e3e6ed;
            padding: 2rem 1.5rem;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .container {
            max-width: 1100px;
            width: 100%;
        }

        /* 头部 */
        .header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            flex-wrap: wrap;
            gap: 1rem;
            margin-bottom: 1.8rem;
            border-bottom: 1px solid #2a2f3a;
            padding-bottom: 1rem;
        }

        .header h1 {
            font-weight: 400;
            font-size: 1.6rem;
            letter-spacing: 1px;
            color: #c9b578;
            text-shadow: 0 0 6px rgba(201, 181, 120, 0.3);
        }

        .header-actions {
            display: flex;
            gap: 0.6rem;
            flex-wrap: wrap;
        }

        /* 通用按钮 */
        .btn {
            background: #1e2530;
            border: 1px solid #2e3848;
            color: #c3cddf;
            padding: 0.5rem 1.1rem;
            border-radius: 30px;
            font-size: 0.88rem;
            cursor: pointer;
            transition: all 0.12s;
            font-weight: 400;
            letter-spacing: 0.2px;
            display: inline-flex;
            align-items: center;
            gap: 0.4rem;
        }

        .btn:hover {
            background: #2a3442;
            border-color: #4d6180;
            color: #eaf0ff;
        }

        .btn-primary {
            background: #2f4155;
            border-color: #a58e4a;
            color: #f2e9d8;
        }

        .btn-primary:hover {
            background: #3c5168;
            border-color: #c9b578;
            box-shadow: 0 0 12px rgba(201, 181, 120, 0.25);
        }

        .btn-danger {
            background: #2a1e22;
            border-color: #5e3038;
            color: #e0a8b0;
        }

        .btn-danger:hover {
            background: #3d262c;
            border-color: #8a4550;
            color: #ffc8d0;
        }

        /* 添加表单 */
        .add-form {
            background: #10161f;
            border: 1px solid #232b37;
            border-radius: 16px;
            padding: 1.2rem 1.2rem 1rem;
            margin-bottom: 1.8rem;
            display: none;
        }

        .add-form.show {
            display: block;
        }

        .form-title {
            font-size: 0.95rem;
            color: #c9b578;
            margin-bottom: 0.9rem;
            font-weight: 400;
            letter-spacing: 0.5px;
        }

        .form-row {
            display: flex;
            flex-wrap: wrap;
            gap: 0.8rem;
            align-items: flex-end;
        }

        .form-group {
            display: flex;
            flex-direction: column;
            gap: 0.35rem;
            flex: 1 0 150px;
        }

        .form-group label {
            font-size: 0.75rem;
            color: #7e8b9f;
            letter-spacing: 0.5px;
            text-transform: uppercase;
        }

        .form-group input,
        .form-group select {
            background: #181f2b;
            border: 1px solid #2b3546;
            color: #e3e6ed;
            padding: 0.55rem 0.9rem;
            border-radius: 30px;
            font-size: 0.92rem;
            outline: none;
            transition: border-color 0.12s;
        }

        .form-group input:focus,
        .form-group select:focus {
            border-color: #a58e4a;
            box-shadow: 0 0 8px rgba(201, 181, 120, 0.2);
        }

        .form-group input::placeholder {
            color: #4f5d72;
        }

        .form-actions {
            display: flex;
            gap: 0.6rem;
            margin-top: 0.9rem;
        }

        /* 筛选栏 */
        .filter-section {
            display: flex;
            flex-wrap: wrap;
            gap: 0.7rem;
            margin-bottom: 1.5rem;
            align-items: center;
        }

        .filter-btn {
            background: #181f2b;
            border: 1px solid #2b3546;
            color: #b3bed5;
            padding: 0.45rem 1.2rem;
            border-radius: 30px;
            font-size: 0.88rem;
            cursor: pointer;
            transition: all 0.1s;
            font-weight: 400;
            letter-spacing: 0.2px;
        }

        .filter-btn:hover {
            background: #1f2a38;
            border-color: #4d6180;
            color: #dee8ff;
        }

        .filter-btn.active {
            background: #2f4155;
            border-color: #a58e4a;
            color: #f2e9d8;
            box-shadow: 0 0 10px rgba(201, 181, 120, 0.2);
        }

        /* 统计 */
        .stats-bar {
            font-size: 0.85rem;
            color: #6b7a92;
            margin-bottom: 1rem;
            display: flex;
            justify-content: space-between;
            flex-wrap: wrap;
            gap: 0.5rem;
        }

        /* 词缀网格 */
        .affix-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(290px, 1fr));
            gap: 1rem;
        }

        /* 卡片 */
        .affix-card {
            background: #10161f;
            border: 1px solid #232b37;
            border-radius: 14px;
            padding: 1rem 1rem 1rem;
            transition: border 0.15s, background 0.15s;
            display: flex;
            flex-direction: column;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.4);
            position: relative;
        }

        .affix-card:hover {
            border-color: #3c4b5e;
            background: #121a24;
        }

        .affix-card-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 0.7rem;
        }

        .affix-category {
            font-size: 0.68rem;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: #7e8b9f;
            font-weight: 500;
            background: #1a212c;
            padding: 0.2rem 0.7rem;
            border-radius: 20px;
            max-width: 60%;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        /* 卡片操作按钮 */
        .card-actions {
            display: flex;
            gap: 0.3rem;
            opacity: 0.4;
            transition: opacity 0.15s;
        }

        .affix-card:hover .card-actions {
            opacity: 1;
        }

        .icon-btn {
            background: transparent;
            border: none;
            color: #6b7a92;
            cursor: pointer;
            font-size: 0.95rem;
            padding: 0.25rem 0.4rem;
            border-radius: 6px;
            transition: all 0.1s;
            line-height: 1;
        }

        .icon-btn:hover {
            background: #1f2a38;
            color: #e3e6ed;
        }

        .icon-btn.delete:hover {
            background: #3d262c;
            color: #ff9aa8;
        }

        /* ========== 名称 + 数值 并列容器 ========== */
        .affix-content {
            display: flex;
            flex-direction: column;
            gap: 0.6rem;
            margin-top: 0.2rem;
        }

        /* 通用复制项样式（名称与数值完全一致） */
        .copy-item {
            display: flex;
            align-items: center;
            gap: 0.5rem;
            background: #1a212c;
            border: 1px solid #2b3546;
            border-radius: 10px;
            padding: 0.6rem 0.8rem;
            cursor: pointer;
            transition: all 0.12s;
            user-select: none;
            position: relative;
        }

        .copy-item:hover {
            background: #212c3b;
            border-color: #a58e4a;
            box-shadow: 0 0 10px rgba(201, 181, 120, 0.15);
        }

        .copy-item:active {
            transform: scale(0.995);
            background: #283545;
        }

        /* 内容文字 */
        .copy-item-text {
            flex: 1;
            font-size: 1rem;
            font-weight: 400;
            letter-spacing: 0.3px;
            color: #e3e6ed;
            word-break: break-word;
            line-height: 1.4;
        }

        /* 复制小图标 */
        .copy-item-icon {
            font-size: 0.9rem;
            opacity: 0.4;
            transition: opacity 0.12s, color 0.12s;
            flex-shrink: 0;
        }

        .copy-item:hover .copy-item-icon {
            opacity: 1;
            color: #c9b578;
        }

        /* 名称特殊一点：让它不至于完全一样，但同样大小 */
        .copy-item.name .copy-item-text {
            color: #f0e6d2;
            font-weight: 450;
        }

        .copy-item.value .copy-item-text {
            font-family: 'JetBrains Mono', 'Fira Code', 'Cascadia Code', monospace;
            font-size: 1rem;
            color: #f0e6d2;
        }

        /* 空状态 */
        .empty-state {
            grid-column: 1 / -1;
            text-align: center;
            padding: 3rem 1rem;
            color: #5b6a80;
            border: 1px dashed #2b3546;
            border-radius: 20px;
            background: #0e131b;
            font-size: 1rem;
            line-height: 1.8;
        }

        /* 复制反馈 */
        .toast {
            position: fixed;
            top: 30px;
            left: 50%;
            transform: translateX(-50%) scale(0.95);
            background: #2a3b4c;
            color: #e0e9ff;
            padding: 0.7rem 1.8rem;
            border-radius: 40px;
            font-size: 0.95rem;
            letter-spacing: 0.3px;
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.7);
            border: 1px solid #4a6180;
            opacity: 0;
            transition: opacity 0.15s, transform 0.15s;
            pointer-events: none;
            z-index: 999;
            backdrop-filter: blur(6px);
            max-width: 90vw;
            word-break: break-all;
            text-align: center;
        }

        .toast.show {
            opacity: 1;
            transform: translateX(-50%) scale(1);
        }

        /* 底部 */
        .footer-note {
            margin-top: 2.5rem;
            color: #4b5a70;
            font-size: 0.78rem;
            text-align: center;
            border-top: 1px solid #1d2530;
            padding-top: 1.5rem;
            line-height: 1.8;
        }

        /* 同步密码输入框 */
        .sync-key-input:focus {
            border-color: #a58e4a;
            box-shadow: 0 0 8px rgba(201, 181, 120, 0.2);
        }

        /* KV 面板 */
        .kv-panel {
            background: #10161f;
            border: 1px solid #232b37;
            border-radius: 16px;
            padding: 1rem 1.2rem;
            margin-bottom: 1.8rem;
            display: none;
        }

        .kv-panel.show {
            display: block;
        }

        .kv-panel .kv-title {
            font-size: 0.95rem;
            color: #c9b578;
            margin-bottom: 0.9rem;
            font-weight: 400;
            letter-spacing: 0.5px;
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        .kv-row {
            display: flex;
            flex-wrap: wrap;
            gap: 0.8rem;
            margin-bottom: 0.8rem;
        }

        .kv-row .kv-field {
            flex: 1 0 280px;
            display: flex;
            flex-direction: column;
            gap: 0.35rem;
        }

        .kv-field label {
            font-size: 0.72rem;
            color: #7e8b9f;
            letter-spacing: 0.3px;
        }

        .kv-field input {
            background: #181f2b;
            border: 1px solid #2b3546;
            color: #e3e6ed;
            padding: 0.5rem 0.9rem;
            border-radius: 30px;
            font-size: 0.88rem;
            outline: none;
        }

        .kv-field input:focus {
            border-color: #a58e4a;
            box-shadow: 0 0 8px rgba(201, 181, 120, 0.2);
        }

        .kv-actions {
            display: flex;
            gap: 0.6rem;
            flex-wrap: wrap;
            align-items: center;
        }

        .kv-status {
            font-size: 0.78rem;
            color: #5b6a80;
        }

        .kv-status.ok { color: #7fbf7f; }
        .kv-status.err { color: #e08a8a; }

        @media (max-width: 600px) {
            body { padding: 1.2rem 0.8rem; }
            .header h1 { font-size: 1.25rem; }
            .affix-grid { grid-template-columns: 1fr; }
            .form-row { flex-direction: column; align-items: stretch; }
        }
    </style>
</head>
<body>
    <div class="container">
        <!-- 头部 -->
        <div class="header">
            <h1>⚔️ 流放之路 · 我的词缀库</h1>
            <div class="header-actions">
                <button class="btn btn-primary" id="toggleAddForm">➕ 添加词缀</button>
                <input type="password" id="syncKeyInput" class="sync-key-input" placeholder="同步密码" autocomplete="off" style="width:90px;height:36px;border-radius:30px;border:1px solid #2b3546;background:#181f2b;color:#e3e6ed;padding:0 0.8rem;font-size:0.82rem;outline:none;">
                <button class="btn" id="pushCloudBtn" title="把当前词缀推送到云端备份">☁️ 推送云端</button>
                <button class="btn" id="pullCloudBtn" title="用云端数据覆盖本地">⬇️ 拉取云端</button>
                <button class="btn" id="exportBtn">📤 导出</button>
                <button class="btn" id="importBtn">📥 导入</button>
                <button class="btn btn-danger" id="clearAllBtn">🗑️ 清空</button>
            </div>
        </div>

        <!-- 添加/编辑表单 -->
        <div class="add-form" id="addForm">
            <div class="form-title" id="formTitle">✨ 添加新词缀</div>
            <div class="form-row">
                <div class="form-group">
                    <label>分类</label>
                    <input type="text" id="inputCategory" list="categoryList" placeholder="例如：负电甲/召唤衣 或 法血/戒指" autocomplete="off">
                    <datalist id="categoryList"></datalist>
                </div>
                <div class="form-group" style="flex: 2 0 200px;">
                    <label>词缀名称</label>
                    <input type="text" id="inputName" placeholder="例如：增加最大生命" autocomplete="off">
                </div>
                <div class="form-group">
                    <label>数值 / 内容</label>
                    <input type="text" id="inputValue" placeholder="例如：22222" autocomplete="off">
                </div>
            </div>
            <div class="form-actions">
                <button class="btn btn-primary" id="saveAffixBtn">💾 保存</button>
                <button class="btn" id="cancelFormBtn">取消</button>
            </div>
        </div>

        <!-- 筛选栏 -->
        <div class="filter-section" id="filterSection">
            <button class="filter-btn active" data-filter="__all__">全部</button>
        </div>

        <!-- 统计 -->
        <div class="stats-bar">
            <span id="affixCount">共 0 条词缀</span>
            <span style="font-size:0.78rem; color:#5b6a80;">数据保存在本地浏览器 · 点击名称或数值均可复制</span>
        </div>

        <!-- 词缀网格 -->
        <div class="affix-grid" id="affixGrid"></div>

        <!-- 底部 -->
        <div class="footer-note">
            <span>名称与数值并列 · 点击任意一个都能复制 · 分类可自定义 · 云端同步需输入密码 · 建议定期导出备份</span>
        </div>
    </div>

    <!-- 复制反馈 -->
    <div class="toast" id="toast">📋 已复制: <span id="toastValue"></span></div>

    <script>
        (function() {
            const STORAGE_KEY = 'poe_my_affixes_v2';

            let affixes = [];
            let currentFilter = '__all__';
            let editingId = null;
            let syncing = false;

            const grid = document.getElementById('affixGrid');
            const toast = document.getElementById('toast');
            const toastValueSpan = document.getElementById('toastValue');
            const affixCountSpan = document.getElementById('affixCount');
            const filterSection = document.getElementById('filterSection');
            const addForm = document.getElementById('addForm');
            const formTitle = document.getElementById('formTitle');
            const inputCategory = document.getElementById('inputCategory');
            const inputName = document.getElementById('inputName');
            const inputValue = document.getElementById('inputValue');
            const categoryList = document.getElementById('categoryList');
            const toggleAddFormBtn = document.getElementById('toggleAddForm');
            const saveAffixBtn = document.getElementById('saveAffixBtn');
            const cancelFormBtn = document.getElementById('cancelFormBtn');
            const exportBtn = document.getElementById('exportBtn');
            const importBtn = document.getElementById('importBtn');
            const clearAllBtn = document.getElementById('clearAllBtn');
            const pushCloudBtn = document.getElementById('pushCloudBtn');
            const pullCloudBtn = document.getElementById('pullCloudBtn');
            const syncKeyInput = document.getElementById('syncKeyInput');

            function generateId() {
                return Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
            }

            function loadFromStorage() {
                try {
                    const raw = localStorage.getItem(STORAGE_KEY);
                    if (raw) {
                        const parsed = JSON.parse(raw);
                        if (Array.isArray(parsed)) {
                            affixes = parsed;
                            return;
                        }
                    }
                } catch (e) {
                    console.warn('读取本地数据失败', e);
                }
                affixes = [];
                saveToStorage();
            }

            function saveToStorage() {
                try {
                    localStorage.setItem(STORAGE_KEY, JSON.stringify(affixes));
                } catch (e) {
                    console.error('保存本地数据失败', e);
                    alert('保存失败，可能是浏览器存储空间不足或被禁用。');
                }
            }

            async function copyToClipboard(text) {
                if (navigator.clipboard && navigator.clipboard.writeText) {
                    try {
                        await navigator.clipboard.writeText(text);
                        return true;
                    } catch (err) {
                        console.warn('clipboard API 失败，尝试降级', err);
                    }
                }
                try {
                    const textarea = document.createElement('textarea');
                    textarea.value = text;
                    textarea.style.position = 'fixed';
                    textarea.style.opacity = '0';
                    textarea.style.left = '-9999px';
                    document.body.appendChild(textarea);
                    textarea.focus();
                    textarea.select();
                    const success = document.execCommand('copy');
                    document.body.removeChild(textarea);
                    return success;
                } catch (err) {
                    console.error('复制失败', err);
                    return false;
                }
            }

            let toastTimer = null;
            function showToast(message, prefix = '📋 已复制') {
                toastValueSpan.textContent = message;
                toast.childNodes[0].textContent = prefix + ': ';
                toast.classList.add('show');
                if (toastTimer) clearTimeout(toastTimer);
                toastTimer = setTimeout(() => {
                    toast.classList.remove('show');
                }, 1600);
            }

            function getAllCategories() {
                const set = new Set();
                affixes.forEach(item => {
                    if (item.category && item.category.trim()) {
                        set.add(item.category.trim());
                    }
                });
                return Array.from(set).sort();
            }

            function updateCategoryDatalist() {
                const categories = getAllCategories();
                categoryList.innerHTML = '';
                categories.forEach(cat => {
                    const option = document.createElement('option');
                    option.value = cat;
                    categoryList.appendChild(option);
                });
            }

            function renderFilterButtons() {
                const allBtn = filterSection.querySelector('[data-filter="__all__"]');
                filterSection.innerHTML = '';
                filterSection.appendChild(allBtn);

                const categories = getAllCategories();
                categories.forEach(cat => {
                    const btn = document.createElement('button');
                    btn.className = 'filter-btn';
                    btn.dataset.filter = cat;
                    btn.textContent = cat;
                    filterSection.appendChild(btn);
                });

                if (currentFilter !== '__all__' && !categories.includes(currentFilter)) {
                    currentFilter = '__all__';
                }

                document.querySelectorAll('.filter-btn').forEach(btn => btn.classList.remove('active'));
                const activeBtn = document.querySelector(`.filter-btn[data-filter="${currentFilter}"]`);
                if (activeBtn) activeBtn.classList.add('active');
                else {
                    currentFilter = '__all__';
                    allBtn.classList.add('active');
                }
            }

            function bindFilterEvents() {
                filterSection.addEventListener('click', (e) => {
                    const btn = e.target.closest('.filter-btn');
                    if (!btn) return;
                    const filter = btn.dataset.filter;
                    if (filter === undefined) return;
                    currentFilter = filter;
                    render();
                });
            }

            function escapeHtml(text) {
                const div = document.createElement('div');
                div.textContent = text;
                return div.innerHTML;
            }

            function createCopyItem(text, type) {
                const item = document.createElement('div');
                item.className = `copy-item ${type}`;
                item.title = `点击复制${type === 'name' ? '名称' : '数值'}`;

                const textEl = document.createElement('span');
                textEl.className = 'copy-item-text';
                textEl.textContent = text;

                const iconEl = document.createElement('span');
                iconEl.className = 'copy-item-icon';
                iconEl.textContent = '📋';

                item.appendChild(textEl);
                item.appendChild(iconEl);

                item.addEventListener('click', async (e) => {
                    e.stopPropagation();
                    const ok = await copyToClipboard(text);
                    if (ok) {
                        showToast(
                            text,
                            type === 'name' ? '📋 已复制名称' : '📋 已复制数值'
                        );
                    }
                });

                return item;
            }

            // ---------- 云同步（服务端 /api/gist/data，无需任何配置） ----------
            function getSyncKey() {
                return (syncKeyInput.value || '').trim();
            }

            async function cloudFetch(method, body) {
                const opts = { method, headers: {} };
                opts.headers['X-Sync-Key'] = getSyncKey();
                if (body !== undefined) {
                    opts.headers['Content-Type'] = 'application/json';
                    opts.body = JSON.stringify(body);
                }
                const resp = await fetch('/api/gist/data', opts);
                const text = await resp.text();
                let data = null;
                try { data = text ? JSON.parse(text) : null; } catch (e) {}
                if (!resp.ok) {
                    const msg = (data && data.message) ? data.message : ('HTTP ' + resp.status);
                    throw new Error(msg);
                }
                return data;
            }

            async function pushCloud() {
                if (syncing) return;
                if (location.protocol === 'file:') {
                    alert('本地文件模式不支持云同步，请使用线上版：\nhttps://poe-affix.pages.dev');
                    return;
                }
                if (!getSyncKey()) {
                    alert('请先输入同步密码');
                    syncKeyInput.focus();
                    return;
                }
                if (!confirm(`将当前 ${affixes.length} 条词缀推送到云端（覆盖云端旧数据），继续？`)) return;
                syncing = true;
                const oldText = pushCloudBtn.textContent;
                pushCloudBtn.textContent = '⏳ 推送中…';
                pushCloudBtn.disabled = true;
                try {
                    const res = await cloudFetch('POST', { affixes: affixes });
                    showToast('已推送 ' + (res.count != null ? res.count : affixes.length) + ' 条到云端', '☁️');
                } catch (err) {
                    alert('推送失败：' + err.message);
                } finally {
                    syncing = false;
                    pushCloudBtn.textContent = oldText;
                    pushCloudBtn.disabled = false;
                }
            }

            async function pullCloud() {
                if (syncing) return;
                if (location.protocol === 'file:') {
                    alert('本地文件模式不支持云同步，请使用线上版：\nhttps://poe-affix.pages.dev');
                    return;
                }
                if (!getSyncKey()) {
                    alert('请先输入同步密码');
                    syncKeyInput.focus();
                    return;
                }
                syncing = true;
                const oldText = pullCloudBtn.textContent;
                pullCloudBtn.textContent = '⏳ 拉取中…';
                pullCloudBtn.disabled = true;
                try {
                    const res = await cloudFetch('GET');
                    const remote = (res && res.affixes != null) ? res.affixes : [];
                    const when = res && res.updated_at ? res.updated_at.slice(0, 19).replace('T', ' ') : '';
                    if (remote.length === 0) {
                        alert('云端没有数据');
                    } else {
                        affixes = remote;
                        saveToStorage();
                        render();
                        showToast('已拉取 ' + remote.length + ' 条词缀' + (when ? '（' + when + '）' : ''), '⬇️');
                    }
                } catch (err) {
                    alert('拉取失败：' + err.message);
                } finally {
                    syncing = false;
                    pullCloudBtn.textContent = oldText;
                    pullCloudBtn.disabled = false;
                }
            }

            // ---------- 渲染 ----------
            function render() {
                updateCategoryDatalist();
                renderFilterButtons();

                const filtered = currentFilter === '__all__'
                    ? affixes
                    : affixes.filter(item => item.category === currentFilter);

                affixCountSpan.textContent = `共 ${affixes.length} 条词缀` +
                    (currentFilter !== '__all__' ? `（当前显示 ${filtered.length} 条）` : '');

                grid.innerHTML = '';

                if (filtered.length === 0) {
                    const emptyDiv = document.createElement('div');
                    emptyDiv.className = 'empty-state';
                    if (affixes.length === 0) {
                        emptyDiv.innerHTML = '📭 还没有任何词缀<br><span style="font-size:0.85rem;color:#4f5d72;">点击右上角「添加词缀」开始创建，分类可自定义</span>';
                    } else {
                        emptyDiv.innerHTML = '🔍 该分类下没有词缀';
                    }
                    grid.appendChild(emptyDiv);
                    return;
                }

                filtered.forEach(item => {
                    const card = document.createElement('div');
                    card.className = 'affix-card';
                    card.dataset.id = item.id;

                    // 头部：分类 + 操作按钮
                    const cardHeader = document.createElement('div');
                    cardHeader.className = 'affix-card-header';

                    const catEl = document.createElement('span');
                    catEl.className = 'affix-category';
                    catEl.textContent = item.category || '未分类';
                    catEl.title = item.category || '未分类';

                    const actions = document.createElement('div');
                    actions.className = 'card-actions';

                    const editBtn = document.createElement('button');
                    editBtn.className = 'icon-btn edit';
                    editBtn.title = '编辑';
                    editBtn.innerHTML = '✏️';
                    editBtn.addEventListener('click', (e) => {
                        e.stopPropagation();
                        startEdit(item.id);
                    });

                    const delBtn = document.createElement('button');
                    delBtn.className = 'icon-btn delete';
                    delBtn.title = '删除';
                    delBtn.innerHTML = '🗑️';
                    delBtn.addEventListener('click', (e) => {
                        e.stopPropagation();
                        deleteAffix(item.id);
                    });

                    actions.appendChild(editBtn);
                    actions.appendChild(delBtn);

                    cardHeader.appendChild(catEl);
                    cardHeader.appendChild(actions);

                    // ========== 名称 + 数值 并列 ==========
                    const contentWrap = document.createElement('div');
                    contentWrap.className = 'affix-content';

                    const nameItem = createCopyItem(item.name, 'name');
                    const valueItem = createCopyItem(item.value, 'value');

                    contentWrap.appendChild(nameItem);
                    contentWrap.appendChild(valueItem);

                    card.appendChild(cardHeader);
                    card.appendChild(contentWrap);

                    grid.appendChild(card);
                });
            }

            function openAddForm() {
                editingId = null;
                formTitle.textContent = '✨ 添加新词缀';
                inputCategory.value = '';
                inputName.value = '';
                inputValue.value = '';
                addForm.classList.add('show');
                inputName.focus();
            }

            function closeForm() {
                addForm.classList.remove('show');
                editingId = null;
                inputName.value = '';
                inputValue.value = '';
            }

            function startEdit(id) {
                const item = affixes.find(a => a.id === id);
                if (!item) return;
                editingId = id;
                formTitle.textContent = '✏️ 编辑词缀';
                inputCategory.value = item.category || '';
                inputName.value = item.name;
                inputValue.value = item.value;
                addForm.classList.add('show');
                inputName.focus();
                addForm.scrollIntoView({ behavior: 'smooth', block: 'center' });
            }

            function saveAffix() {
                const category = inputCategory.value.trim();
                const name = inputName.value.trim();
                const value = inputValue.value.trim();

                if (!category) {
                    alert('请输入分类（例如：负电甲/召唤衣、法血/戒指）');
                    inputCategory.focus();
                    return;
                }
                if (!name) {
                    alert('请输入词缀名称');
                    inputName.focus();
                    return;
                }
                if (!value) {
                    alert('请输入数值/内容');
                    inputValue.focus();
                    return;
                }

                if (editingId) {
                    const index = affixes.findIndex(a => a.id === editingId);
                    if (index !== -1) {
                        affixes[index] = { ...affixes[index], category, name, value };
                    }
                } else {
                    affixes.push({
                        id: generateId(),
                        category,
                        name,
                        value
                    });
                }

                saveToStorage();
                render();
                closeForm();
            }

            function deleteAffix(id) {
                const item = affixes.find(a => a.id === id);
                if (!item) return;
                if (!confirm(`确定删除词缀「${item.name}」？`)) return;
                affixes = affixes.filter(a => a.id !== id);
                saveToStorage();
                render();
                if (editingId === id) closeForm();
            }

            function clearAll() {
                if (affixes.length === 0) {
                    alert('已经是空的了');
                    return;
                }
                if (!confirm(`确定要清空所有 ${affixes.length} 条词缀吗？此操作不可恢复！`)) return;
                if (!confirm('再次确认：真的要全部删除吗？')) return;
                affixes = [];
                saveToStorage();
                render();
                closeForm();
            }

            function exportData() {
                const dataStr = JSON.stringify(affixes, null, 2);
                const blob = new Blob([dataStr], { type: 'application/json' });
                const url = URL.createObjectURL(blob);
                const a = document.createElement('a');
                const date = new Date().toISOString().slice(0, 10);
                a.href = url;
                a.download = `poe-affixes-${date}.json`;
                a.click();
                URL.revokeObjectURL(url);
                showToast('已导出 JSON 文件', '📤');
            }

            function importData() {
                const input = document.createElement('input');
                input.type = 'file';
                input.accept = '.json,application/json';
                input.addEventListener('change', (e) => {
                    const file = e.target.files[0];
                    if (!file) return;
                    const reader = new FileReader();
                    reader.onload = (ev) => {
                        try {
                            const imported = JSON.parse(ev.target.result);
                            if (!Array.isArray(imported)) {
                                alert('文件格式不正确，应为词缀数组');
                                return;
                            }
                            const valid = imported.filter(item =>
                                item && typeof item.name === 'string' && typeof item.value === 'string'
                            ).map(item => ({
                                id: item.id || generateId(),
                                category: (item.category && typeof item.category === 'string') ? item.category.trim() : '未分类',
                                name: item.name,
                                value: item.value
                            }));
                            if (valid.length === 0) {
                                alert('没有找到有效的词缀数据');
                                return;
                            }
                            if (!confirm(`即将导入 ${valid.length} 条词缀。\n当前已有 ${affixes.length} 条，导入后总数将为 ${affixes.length + valid.length} 条。是否继续？`)) return;
                            affixes = affixes.concat(valid);
                            saveToStorage();
                            render();
                            showToast(`成功导入 ${valid.length} 条`, '📥');
                        } catch (err) {
                            alert('解析文件失败：' + err.message);
                        }
                    };
                    reader.readAsText(file);
                });
                input.click();
            }

            function bindEvents() {
                toggleAddFormBtn.addEventListener('click', () => {
                    if (addForm.classList.contains('show')) {
                        closeForm();
                    } else {
                        openAddForm();
                    }
                });

                saveAffixBtn.addEventListener('click', saveAffix);
                cancelFormBtn.addEventListener('click', closeForm);

                inputName.addEventListener('keydown', (e) => {
                    if (e.key === 'Enter') {
                        e.preventDefault();
                        inputValue.focus();
                    }
                });
                inputValue.addEventListener('keydown', (e) => {
                    if (e.key === 'Enter') {
                        e.preventDefault();
                        saveAffix();
                    }
                });

                // 云同步
                pushCloudBtn.addEventListener('click', pushCloud);
                pullCloudBtn.addEventListener('click', pullCloud);

                exportBtn.addEventListener('click', exportData);
                importBtn.addEventListener('click', importData);
                clearAllBtn.addEventListener('click', clearAll);

                toast.addEventListener('click', () => {
                    toast.classList.remove('show');
                    if (toastTimer) clearTimeout(toastTimer);
                });

                bindFilterEvents();
            }

            function init() {
                loadFromStorage();
                // 回填同步密码
                try {
                    const savedKey = localStorage.getItem('poe_sync_key');
                    if (savedKey) syncKeyInput.value = savedKey;
                } catch (e) {}
                syncKeyInput.addEventListener('change', function() {
                    try { localStorage.setItem('poe_sync_key', getSyncKey()); } catch (e) {}
                });
                syncKeyInput.addEventListener('blur', function() {
                    try { localStorage.setItem('poe_sync_key', getSyncKey()); } catch (e) {}
                });
                bindEvents();
                render();
            }

            init();
        })();
    </script>
</body>
</html>
